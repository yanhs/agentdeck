# agents.reimake.com — the agent terminal dashboard (moved from reimake.com/agents/).
# Serves terminal/web/ and proxies the same status APIs + ttyd terminals.
server {
    server_name agents.reimake.com;

    # Let's Encrypt renewals must stay reachable without auth.
    location ^~ /.well-known/acme-challenge/ { auth_request off; allow all; root /var/www/html; }

    # Cookie-session auth (replaces the basic-auth browser dialog, which re-prompted
    # on every 401 and stormed when polling/reload requests piled up). One login on
    # /login -> signed cookie -> every request (fetch, iframe, ttyd ws) carries it.
    auth_request /__auth;
    error_page 401 = @agents_login;

    location = /__auth {
        internal;
        proxy_pass http://127.0.0.1:3046/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location @agents_login { return 302 /login; }
    location = /login {
        auth_request off;
        proxy_pass http://127.0.0.1:3046/login;
        proxy_set_header Host $host;
    }
    location = /logout {
        auth_request off;
        proxy_pass http://127.0.0.1:3046/logout;
        proxy_set_header Cookie $http_cookie;
    }

    # Top-right dashboard buttons (were falling through to index.html -> "did nothing")
    location = /telegram {
        proxy_pass http://127.0.0.1:3011/telegram;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
    }
    location = /change-password {
        proxy_pass http://127.0.0.1:3046/change-password;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    # Status / buffer / page-version APIs
    location /api/terminal-status { proxy_pass http://127.0.0.1:3011/; proxy_http_version 1.1; proxy_set_header Host $host; }
    location /api/tmux-buffer/    { proxy_pass http://127.0.0.1:3045/; proxy_http_version 1.1; proxy_set_header Host $host; }
    location = /api/page-version  { proxy_pass http://127.0.0.1:3014/; proxy_http_version 1.1; proxy_set_header Host $host; }
    location = /api/paste-image  { proxy_pass http://127.0.0.1:3047/; proxy_http_version 1.1; proxy_set_header Host $host; client_max_body_size 25m; }

    location /terminal-oo { proxy_pass http://127.0.0.1:3021; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection 'upgrade'; proxy_set_header Host $host; proxy_cache_bypass $http_upgrade; proxy_read_timeout 86400; }
    location /test-terminal { proxy_pass http://127.0.0.1:3099; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection 'upgrade'; proxy_set_header Host $host; proxy_cache_bypass $http_upgrade; proxy_read_timeout 86400; }

    # Session library: ONE ttyd for every topic (/sess/?arg=<id> -> open-session.sh <id>,
    # PM2 app "sessions") and its registry API in status_server (path kept: /api/library/...).
    # Both sit behind the server-level cookie auth_request above.
    location = /sess { return 301 /sess/$is_args$args; }
    location /sess/ { proxy_pass http://127.0.0.1:3031; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection 'upgrade'; proxy_set_header Host $host; proxy_cache_bypass $http_upgrade; proxy_read_timeout 86400; }
    location /api/library { proxy_pass http://127.0.0.1:3011; proxy_http_version 1.1; proxy_set_header Host $host; }

    # Server page (web/server.html): CPU / RAM of agents, sites and jobs, from
    # status_server's collector. Behind the same server-level cookie auth_request.
    location = /api/server { proxy_pass http://127.0.0.1:3011; proxy_http_version 1.1; proxy_set_header Host $host; }

    # Live task tracker (shared across agents) — SSE dashboard
    location = /tasks { return 301 /tasks/; }
    location /tasks/ {
        proxy_pass http://127.0.0.1:9308/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Dashboard UI
    location / {
        root /home/ubuntu/pr/terminal/web;
        index index.html;
        try_files $uri $uri/ /index.html;
        # revalidate: after logout the browser must get the login redirect, not a cached page
        add_header Cache-Control "no-cache";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/agents.reimake.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/agents.reimake.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = agents.reimake.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name agents.reimake.com;
    return 404; # managed by Certbot


}