# AgentKennel behind your own nginx — a template for the manual setup (docs/manual-setup.md).
# The one-line installer and Docker use Caddy instead and don't need this file.
#
# Replace before use:
#   agents.example.com      -> your domain (its A record points at this server)
#   /home/deck/agentkennel  -> your checkout
#   the ssl_certificate lines -> your certificate (see the comments at the bottom)
# Start status_server.py with AGENTKENNEL_ORIGIN=https://agents.example.com: this file does
# not pass X-Forwarded-Proto, so the backend can't tell the dashboard's origin by itself.
#
# Serves web/ and proxies the status APIs, the task board and the one ttyd behind a
# cookie login (status_server.py on 127.0.0.1).
server {
    listen 443 ssl;
    server_name agents.example.com;

    # Let's Encrypt renewals must stay reachable without auth.
    location ^~ /.well-known/acme-challenge/ { auth_request off; allow all; root /var/www/html; }

    # Cookie-session auth (replaces the basic-auth browser dialog, which re-prompted
    # on every 401 and stormed when polling/reload requests piled up). One login on
    # /login -> signed cookie -> every request (fetch, iframe, ttyd ws) carries it.
    auth_request /__auth;
    error_page 401 = @agents_login;

    location = /__auth {
        internal;
        proxy_pass http://127.0.0.1:3046/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # the probe never reads the body: no size limit HERE, or nginx's default 1m turns
        # every upload / pasted screenshot above 1 MB into a 413 → 500 before its own route
        client_max_body_size 0;
        proxy_set_header Cookie $http_cookie;
    }
    location @agents_login { return 302 /login; }
    location = /login {
        auth_request off;
        proxy_pass http://127.0.0.1:3046/login;
        proxy_set_header Host $host;
    }
    location = /logout {
        auth_request off;
        proxy_pass http://127.0.0.1:3046/logout;
        proxy_set_header Cookie $http_cookie;
    }

    # Pages behind the dashboard's ⋯ menu: Telegram setup and the password change
    location = /telegram {
        proxy_pass http://127.0.0.1:3011/telegram;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
    }
    location = /change-password {
        proxy_pass http://127.0.0.1:3046/change-password;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    # Status / buffer / page-version APIs
    location /api/terminal-status { proxy_pass http://127.0.0.1:3011/; proxy_http_version 1.1; proxy_set_header Host $host; }
    location /api/tmux-buffer/    { proxy_pass http://127.0.0.1:3045/; proxy_http_version 1.1; proxy_set_header Host $host; }
    location = /api/page-version  { proxy_pass http://127.0.0.1:3014/; proxy_http_version 1.1; proxy_set_header Host $host; }
    location = /api/paste-image  { proxy_pass http://127.0.0.1:3047/; proxy_http_version 1.1; proxy_set_header Host $host; client_max_body_size 25m; }
    # 📎 File uploads: full path kept, streamed (no buffering), status_server caps at 100 MB
    location = /api/upload { proxy_pass http://127.0.0.1:3047; proxy_http_version 1.1; proxy_set_header Host $host; client_max_body_size 101m; proxy_request_buffering off; }

    # Session library: ONE ttyd for every topic (/sess/?arg=<id> -> open-session.sh <id>,
    # PM2 app "sessions") and its registry API in status_server (path kept: /api/library/...).
    # Both sit behind the server-level cookie auth_request above.
    location = /sess { return 301 /sess/$is_args$args; }
    location /sess/ { proxy_pass http://127.0.0.1:3031; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection 'upgrade'; proxy_set_header Host $host; proxy_cache_bypass $http_upgrade; proxy_read_timeout 86400; }
    location /api/library { proxy_pass http://127.0.0.1:3011; proxy_http_version 1.1; proxy_set_header Host $host; }

    # Server page (web/server.html): CPU / RAM of agents, sites and jobs, from
    # status_server's collector. Behind the same server-level cookie auth_request.
    location = /api/server { proxy_pass http://127.0.0.1:3011; proxy_http_version 1.1; proxy_set_header Host $host; }
    # the Claude allowance (5 hours / week) and today by terminal (status_server)
    location /api/quota { proxy_pass http://127.0.0.1:3011; proxy_http_version 1.1; proxy_set_header Host $host; }
    # its Services block: the services keeper's list, log tail and buttons (status_server)
    location /api/services { proxy_pass http://127.0.0.1:3011; proxy_http_version 1.1; proxy_set_header Host $host; }
    # an optional module's API in status_server (the Caddyfiles route it too); harmless if unused
    location /api/guests { proxy_pass http://127.0.0.1:3011; proxy_http_version 1.1; proxy_set_header Host $host; }

    # Live task tracker (shared across agents) — SSE dashboard
    location = /tasks { return 301 /tasks/; }
    location /tasks/ {
        proxy_pass http://127.0.0.1:9308/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # the tab / bookmark / home-screen icon: public, so the login page shows it too
    location ~ ^/(favicon\.svg|favicon\.ico|apple-touch-icon\.png)$ { auth_request off; root /home/deck/agentkennel/web; }

    # Dashboard UI
    location / {
        root /home/deck/agentkennel/web;
        index index.html;
        try_files $uri $uri/ /index.html;
        # revalidate: after logout the browser must get the login redirect, not a cached page
        add_header Cache-Control "no-cache";
    }

    # TLS certificate. With certbot:  sudo certbot certonly --webroot -w /var/www/html -d agents.example.com
    # puts it in /etc/letsencrypt/live/agents.example.com/ (renewals use the
    # /.well-known/acme-challenge/ location above). Any other certificate works: point these
    # two lines at its full chain and its private key.
    ssl_certificate     /etc/letsencrypt/live/agents.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agents.example.com/privkey.pem;
}

# Plain http: answer certificate renewals, send everything else to https.
server {
    listen 80;
    server_name agents.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
