      <div class="ph" id="ph">Pick a terminal on the left</div>
    </div>
    <div class="mob-input" id="mobInput">
      <button id="mobEsc" title="Ctrl+C">⎋</button>
      <input type="text" id="mobText" placeholder="Type here..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div class="mob-arrows">
        <button class="mob-arrow" id="mobLeft" title="Cursor left">←</button>
        <button class="mob-arrow" id="mobUp" title="Cursor up / history">↑</button>
        <button class="mob-arrow" id="mobDown" title="Cursor down / history">↓</button>
        <button class="mob-arrow" id="mobRight" title="Cursor right">→</button>
      </div>
      <button id="mobSend" title="Send">↵</button>
    </div>
  </div>

  <script>
    /* ── Session library ──
       The left column is the list of topics (sessions) from GET /api/library:
       loaded ones (in RAM, status dot) first, then unloaded ones (greyed); each
       group most recently used first — the same order as library.display_order.
       A topic is addressed ONLY by its 8-hex code; there are no slot numbers.
       Opening one = iframe /sess/?arg=<code> (the server loads it if needed). */
    const ID_RE = /^[0-9a-f]{8}$/;
    const _isMobile = window.matchMedia('(max-width: 700px)').matches;
    let sel = null;            // code of the open topic
    let sessions = [];         // last /api/library payload (+ local edits)
    let editing = null;        // code whose name is being edited — freezes re-render
    let mutSeq = 0;            // bumped on every local change; a poll that started
                               // before it is stale and must not overwrite it
    const rows = new Map();    // code -> row element (kept across polls)
    const list = document.getElementById('list');
    const search = document.getElementById('search');
    const libTools = document.getElementById('libTools');
    const newBtn = document.getElementById('newBtn');
    const newForm = document.getElementById('newForm');
    const newName = document.getElementById('newName');
    const newOk = document.getElementById('newOk');
    const libEmpty = document.getElementById('libEmpty');
    const archToggle = document.getElementById('showArchived');
    /* ── Tasks: the task board as a tab in the viewer (the T button). While it
       is open a "Tasks" row is pinned at the very top; ✕ closes it. Open/closed
       is remembered per browser. `sel === TASKS` = the board is shown. */
    const TASKS = 'tasks';
    const TASKS_PATH = '/tasks/';
    let tasksOpen = false;
    try { tasksOpen = localStorage.getItem('lib-tasks-open') === '1'; } catch {}
    const tasksRow = document.createElement('div');
    tasksRow.className = 'card tasks-row';
    tasksRow.dataset.tasks = '1';
    tasksRow.innerHTML = `
        <div class="card-top">
          <div class="proj">Tasks</div>
          <div class="card-btns">
            <button type="button" class="tasks-close" title="Close task board" aria-label="Close task board">✕</button>
            <span class="dot idle" title="open"></span>
          </div>
        </div>`;
    tasksRow.title = 'Task board — click to show it';
    function saveTasksOpen() {
      try { localStorage.setItem('lib-tasks-open', tasksOpen ? '1' : '0'); } catch {}
    }
    /* ── Server: the server status page (web/server.html) as a tab, exactly like
       Tasks — the gauge button opens it, a pinned "Server" row stays while it is
       open, ✕ closes it; remembered per browser. `sel === SERVER` = it is shown. */
    const SERVER = 'server';
    const SERVER_PATH = '/server.html';
    let serverOpen = false;
    try { serverOpen = localStorage.getItem('lib-server-open') === '1'; } catch {}
    const serverRow = document.createElement('div');
    serverRow.className = 'card server-row';
    serverRow.dataset.server = '1';
    serverRow.innerHTML = `
        <div class="card-top">
          <div class="proj">Server</div>
          <div class="card-btns">
            <button type="button" class="server-close" title="Close server status" aria-label="Close server status">✕</button>
            <span class="dot idle" title="open"></span>
          </div>
        </div>`;
    serverRow.title = 'Server status — click to show it';
    function saveServerOpen() {
      try { localStorage.setItem('lib-server-open', serverOpen ? '1' : '0'); } catch {}
    }
    /* ── cmd: the one plain command line (tmux cmd-shell, /sess/?arg=shell).
       GET /api/library reports it in `shell` (not in sessions[]); while it is
       loaded it is a row pinned above the topics. `sel === SHELL` = it is open. */
    const SHELL = 'shell';
    const SHELL_PATH = '/sess/?arg=shell';
    let shellState = null;     // {active, attached, status} from the last poll
    const shellRow = document.createElement('div');
    shellRow.className = 'card shell-row';
    shellRow.dataset.shell = '1';
    shellRow.innerHTML = `
        <div class="card-top">
          <div class="proj">Command line</div>
          <div class="card-btns">
            <button type="button" class="shell-close" title="Close command line" aria-label="Close command line">✕</button>
            <span class="dot off"></span>
          </div>
        </div>`;
    shellRow.title = 'Command line (bash) — click to open';
    shellRow.addEventListener('click', e => {
      if (e.target.closest('.shell-close')) return;
      pickShell();
    });
    shellRow.querySelector('.shell-close').addEventListener('click', e => {
      e.stopPropagation();
      closeShell();
    });

    // ✕ on the row: one click, no confirm; the row goes at once, back on error
    async function closeShell() {
      const was = shellState;
      shellState = {active: false, attached: false, status: 'off'};
      mutSeq++;                                // a poll in flight still sees it running
      if (sel === SHELL) showPlaceholder();
      render();
      try {
        await jpost('/api/library/shell-close', {});
      } catch (err) {
        shellState = was;
        mutSeq++;
        render();
        _toast('⚠️ Command line not closed: ' + String(err && err.message || err).slice(0, 60), 5000);
      }
    }
    document.getElementById('cmdBtn').addEventListener('click', () => pickShell());
    if (_isMobile) search.placeholder = 'Search';   // 16px font, ~130px wide on a phone
    // "Show archived" is remembered per browser (storage may be unavailable)
    let showArch = false;
    try { showArch = localStorage.getItem('lib-show-archived') === '1'; } catch {}
    if (localStorage.getItem('stats-hidden') === 'true') document.getElementById('sysStats').classList.add('hidden');

    async function jpost(path, body) {
      const r = await fetch(path, {method: 'POST', credentials: 'same-origin',
        headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
      let d = null;
      try { d = await r.json(); } catch {}
      if (!r.ok) throw new Error((d && d.error) || ('HTTP ' + r.status));
      return d;
    }

    function byId(id) { return sessions.find(s => s.id === id); }

    function norm(q) { return (q || '').trim().toLocaleLowerCase(); }

    // same rule as library.search: name substring (any case) or code prefix
    function matches(s, q) {
      return !q || s.name.toLocaleLowerCase().includes(q) || s.id.startsWith(q);
    }

    // Archived topics are listed when "Show archived" is on, and also whenever
    // the search box is non-empty (search covers the archive). The poll always
    // fetches them (?archived=1), so both switch instantly from the last fetch.
    function wantArch() { return showArch || !!norm(search.value); }

    // Same rule as library.display_order: loaded first, then the rest; inside
    // each group the manual order (pos) first, then most recently used.
    function hasPos(s) { return typeof s.pos === 'number' && isFinite(s.pos); }
    function byOrder(a, b) {
      return (!!b.active - !!a.active)
          || (hasPos(b) - hasPos(a))
          || (hasPos(a) ? a.pos - b.pos : (b.last_used || 0) - (a.last_used || 0));
    }

    function ordered() {
      const q = norm(search.value);
      const arch = wantArch();
      return sessions
        .map((s, i) => [s, i])
        .filter(([s]) => (arch || !s.archived) && matches(s, q))
        .sort((a, b) => (!!a[0].archived - !!b[0].archived)     // archived last
                     || byOrder(a[0], b[0])
                     || (a[1] - b[1]))
        .map(([s]) => s);
    }

    function makeRow(id) {
      const c = document.createElement('div');
      c.className = 'card';
      c.dataset.sid = id;
      c.innerHTML = `
        <div class="card-top">
          <div class="proj"></div>
          <div class="card-btns">
            <button type="button" class="card-btn edit" title="Rename">✎</button>
            <span class="dot off"></span>
          </div>
        </div>
        <div class="card-row2">
          <span class="sid" title="Show this terminal's tasks"></span>
          <button type="button" class="mv-btn up" title="Move up" aria-label="Move up">▲</button>
          <button type="button" class="mv-btn down" title="Move down" aria-label="Move down">▼</button>
          <button type="button" class="arch-btn">Archive</button>
          <button type="button" class="del-btn" hidden title="Delete this archived terminal (the transcript is moved to trash)">Delete</button>
        </div>`;
      c.querySelector('.sid').textContent = id;
      c.addEventListener('click', e => {
        if (e.target.closest('.card-btn, .arch-btn, .del-btn, .mv-btn, input')) return;
        if (Date.now() - _dragEndedAt < 300) return;     // the end of a drag is not a click
        if (e.target.closest('.sid')) { openTasks(id); return; }   // code → its tasks (archived too)
        const s = byId(id);
        if (s && s.archived) { _toast('Archived terminal — click Restore to open it', 3000); return; }
        pick(id);
      });
      c.querySelector('.card-btn.edit').addEventListener('click', e => {
        e.stopPropagation();
        startEdit(id);
      });
      c.querySelector('.arch-btn').addEventListener('click', e => {
        e.stopPropagation();
        const s = byId(id);
        archive(id, !(s && s.archived));      // one click: archive, or restore
      });
      c.querySelector('.mv-btn.up').addEventListener('click', e => { e.stopPropagation(); step(id, -1); });
      c.querySelector('.mv-btn.down').addEventListener('click', e => { e.stopPropagation(); step(id, +1); });
      c.draggable = true;
      c.addEventListener('dragstart', e => {
        if (editing) { e.preventDefault(); return; }
        _dragId = id;
        c.classList.add('dragging');
        try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', id); } catch {}
      });
      c.addEventListener('dragover', e => {
        if (!_dragId || _dragId === id) return;
        e.preventDefault();
        const after = dropAfter(c, e);
        c.classList.toggle('drop-before', !after);
        c.classList.toggle('drop-after', after);
      });
      c.addEventListener('dragleave', () => c.classList.remove('drop-before', 'drop-after'));
      c.addEventListener('drop', e => {
        e.preventDefault();
        c.classList.remove('drop-before', 'drop-after');
        const from = _dragId;
        if (!from || from === id) return;
        const order = ordered().map(s => s.id).filter(x => x !== from);
        const at = order.indexOf(id);
        if (at < 0) return;
        order.splice(dropAfter(c, e) ? at + 1 : at, 0, from);
        applyOrder(order);
      });
      c.addEventListener('dragend', () => {
        c.classList.remove('dragging');
        _dragId = null;
        _dragEndedAt = Date.now();
        for (const el of rows.values()) el.classList.remove('drop-before', 'drop-after');
      });
      c.querySelector('.del-btn').addEventListener('click', e => {
        e.stopPropagation();
        del(id);                              // one click: trash keeps the transcript
      });
      rows.set(id, c);
      return c;
    }

    function fill(c, s, firstOff, firstArch) {
      c.classList.toggle('sel', s.id === sel);
      c.draggable = true;
      c.classList.toggle('unloaded', !s.active);
      c.classList.toggle('archived', !!s.archived);
      c.classList.toggle('first-off', firstOff);
      c.classList.toggle('first-arch', firstArch);
      const ab = c.querySelector('.arch-btn');
      ab.textContent = s.archived ? 'Restore' : 'Archive';
      ab.classList.toggle('restore', !!s.archived);
      c.querySelector('.del-btn').hidden = !s.archived;
      ab.title = s.archived ? 'Restore this terminal to the list'
                            : 'Archive this terminal (the conversation stays on disk)';
      const pe = c.querySelector('.proj');
      if (!pe.querySelector('input')) pe.textContent = s.name;
      pe.title = s.name;
      const st = !s.active ? 'off' : s.status === 'working' ? 'working' : 'idle';
      const dot = c.querySelector('.dot');
      dot.className = 'dot ' + st;
      dot.title = s.archived ? 'archived'
                : st === 'off' ? 'unloaded — click to load'
                : st === 'working' ? 'loaded, working' : 'loaded, idle';
    }

    function shellShown() {
      if (!shellState || !shellState.active) return false;
      const q = norm(search.value);
      return !q || 'command line cmd shell bash'.includes(q);
    }

    function fillShell() {
      shellRow.classList.toggle('sel', sel === SHELL);
      const st = shellState && shellState.status === 'working' ? 'working' : 'idle';
      const dot = shellRow.querySelector('.dot');
      dot.className = 'dot ' + st;
      dot.title = st === 'working' ? 'loaded, working' : 'loaded, idle';
    }

    function tasksShown() {
      if (!tasksOpen) return false;
      const q = norm(search.value);
      return !q || 'tasks task board'.includes(q);
    }

    function serverShown() {
      if (!serverOpen) return false;
      const q = norm(search.value);
      return !q || 'server status'.includes(q);
    }

    function render() {
      if (editing) return;                    // never pull the input out from under the user
      // pinned rows, in this order, above the terminals: Tasks, Server, Command line
      const showTasks = tasksShown();
      const showServer = serverShown();
      const showShell = shellShown();
      tasksRow.classList.toggle('sel', sel === TASKS);
      serverRow.classList.toggle('sel', sel === SERVER);
      if (showShell) fillShell();
      let pin = null;
      for (const [el, on] of [[tasksRow, showTasks], [serverRow, showServer], [shellRow, showShell]]) {
        if (!on) { if (el.parentNode) el.remove(); continue; }
        const ref = pin ? pin.nextSibling : list.firstChild;
        if (el !== ref) list.insertBefore(el, ref);
        pin = el;
      }
      const want = ordered();
      const keep = new Set(want.map(s => s.id));
      for (const [id, el] of rows) if (!keep.has(id)) { el.remove(); rows.delete(id); }
      const anyOn = want.some(s => s.active && !s.archived);
      const anyLive = want.some(s => !s.archived);
      let prev = pin, seenOff = false, seenArch = false;
      for (const s of want) {
        const c = rows.get(s.id) || makeRow(s.id);
        fill(c, s, anyOn && !s.active && !s.archived && !seenOff,
             anyLive && !!s.archived && !seenArch);
        if (!s.active && !s.archived) seenOff = true;
        if (s.archived) seenArch = true;
        const ref = prev ? prev.nextSibling : list.firstChild;
        if (c !== ref) list.insertBefore(c, ref);
        prev = c;
      }
      libEmpty.hidden = want.length > 0;
      libEmpty.textContent = norm(search.value) ? 'No matches'
                                                : 'No terminals yet — click “＋ New terminal”';
      archToggle.textContent = showArch ? 'Hide archived' : 'Show archived';
      archToggle.classList.toggle('on', showArch);
      if (list.lastChild !== archToggle) list.appendChild(archToggle);   // always at the bottom
    }

    archToggle.addEventListener('click', () => {
      showArch = !showArch;
      try { localStorage.setItem('lib-show-archived', showArch ? '1' : '0'); } catch {}
      mutSeq++;                                // a poll in flight has the other view
      render();
      poll();
    });

    function syncSel() {
      for (const [i, el] of rows) el.classList.toggle('sel', i === sel);
      shellRow.classList.toggle('sel', sel === SHELL);
      tasksRow.classList.toggle('sel', sel === TASKS);
      serverRow.classList.toggle('sel', sel === SERVER);
      if (sel === TASKS) {
        document.getElementById('tInfo').innerHTML = '<b>Task board</b>';
      } else if (sel === SERVER) {
        document.getElementById('tInfo').innerHTML = '<b>Server status</b>';
      } else if (sel === SHELL) syncTop(Object.assign({id: SHELL, name: 'Command line'}, shellState || {}));
      else if (sel) syncTop(byId(sel) || {id: sel, name: ''});
    }

    let _searching = false;
    search.addEventListener('input', () => {
      render();                               // instant, from the last poll
      const now = !!norm(search.value);
      if (now && !_searching) poll();         // then refresh the archive in the background
      _searching = now;
    });
    search.addEventListener('keydown', e => {
      if (e.key === 'Enter') {                 // Enter = open the top match
        e.preventDefault();
        const first = ordered().find(s => !s.archived);
        if (first) pick(first.id);
      } else if (e.key === 'Escape') {
        search.value = ''; _searching = false; render();
      }
    });

    /* ── ＋ New topic: ask for a name inline, create, open ── */
    let _creating = false;
    function openNewForm() {
      libTools.classList.add('creating');
      newForm.hidden = false;
      newName.value = '';
      newName.focus();
    }
    function closeNewForm() {
      libTools.classList.remove('creating');
      newForm.hidden = true;
    }
    newBtn.addEventListener('click', openNewForm);
    document.getElementById('newCancel').addEventListener('click', closeNewForm);
    newName.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.preventDefault(); closeNewForm(); }
    });
    newForm.addEventListener('submit', async e => {
      e.preventDefault();
      if (_creating) return;
      _creating = true; newOk.disabled = true;
      const name = newName.value.trim();       // empty → the server names it «Terminal DD.MM HH:MM»
      try {
        const d = await jpost('/api/library/new', {name});
        const s = d && (d.session || d);
        if (!s || !ID_RE.test(s.id)) throw new Error('the server returned no terminal code');
        mutSeq++;
        if (!byId(s.id)) sessions.push(Object.assign({}, s, {name: String(s.name ?? name)}));
        closeNewForm();
        search.value = ''; _searching = false;
        render();
        pick(s.id);
        setTimeout(poll, 1500);                // pick up "loaded" once ttyd has started it
      } catch (err) {
        _toast('⚠️ New terminal: ' + String(err && err.message || err).slice(0, 80), 5000);
      } finally {
        _creating = false; newOk.disabled = false;
      }
    });

    /* ── ✎ rename (inline, like the old project-name editor) ── */
    function startEdit(id) {
      const c = rows.get(id);
      if (!c) return;
      const pe = c.querySelector('.proj');
      if (pe.querySelector('input')) return;
      const s = byId(id);
      const cur = s ? s.name : pe.textContent;
      const inp = document.createElement('input');
      inp.className = 'proj-edit';
      inp.value = cur;
      inp.maxLength = 200;
      inp.placeholder = 'Terminal name';
      pe.textContent = '';
      pe.appendChild(inp);
      c.draggable = false;                     // let the mouse select text in the input
      editing = id;
      inp.focus();
      inp.select();

      let done = false;
      function finish(save) {
        if (done) return;
        done = true;
        editing = null;
        const val = inp.value.trim();
        const changed = save && val && val !== cur;
        pe.textContent = changed ? val : cur;  // also drops the input
        if (changed) {
          mutSeq++;
          if (s) s.name = val;
          jpost('/api/library/rename', {id, name: val}).catch(err => {
            if (s && s.name === val) s.name = cur;
            render(); syncSel();
            _toast('⚠️ Not renamed: ' + String(err && err.message || err).slice(0, 60), 5000);
          });
          if (id === sel) syncSel();
        }
        render();
      }
      inp.addEventListener('keydown', e => {
        e.stopPropagation();
        if (e.key === 'Enter') { e.preventDefault(); finish(true); }
        else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
      });
      inp.addEventListener('blur', () => finish(true));
      inp.addEventListener('click', e => e.stopPropagation());
    }

    /* ── Archive / Restore: one click. Archived topics stay reachable via
       "Show archived" at the bottom of the list, so no confirm step. ── */
    async function archive(id, archived) {
      const s = byId(id);
      const was = s ? !!s.archived : !archived;
      if (s) s.archived = archived;
      mutSeq++;
      render();
      try {
        const d = await jpost('/api/library/archive', {id, archived});
        const nm = (s ? s.name : id).slice(0, 40);
        _toast(!archived ? 'Restored “' + nm + '”'
               : d && d.unload_pending ? 'Archived “' + nm + '” — it is busy, so it stays loaded until idle'
               : 'Archived “' + nm + '” — the conversation is kept', 3000);
      } catch (err) {
        if (s) s.archived = was;
        render();
        _toast('⚠️ ' + (archived ? 'Not archived: ' : 'Not restored: ')
               + String(err && err.message || err).slice(0, 60), 5000);
      }
    }

    /* ── Manual order: drag a row (desktop) or ▲▼ (touch). Optimistic: the
       list moves at once, POST /api/library/reorder with the full visible
       order; on error the old order comes back with a toast. ── */
    let _dragId = null, _dragEndedAt = 0;
    try { if (navigator.maxTouchPoints > 0 || 'ontouchstart' in window)
            document.documentElement.classList.add('touch'); } catch {}

    function dropAfter(c, e) {
      const r = c.getBoundingClientRect();
      return e.clientY > r.top + r.height / 2;
    }

    function step(id, d) {
      const order = ordered().map(s => s.id);
      const i = order.indexOf(id), j = i + d;
      if (i < 0 || j < 0 || j >= order.length) return;
      [order[i], order[j]] = [order[j], order[i]];
      applyOrder(order);
    }

    async function applyOrder(ids) {
      const was = new Map(sessions.map(s => [s.id, s.pos]));
      ids.forEach((id, i) => { const s = byId(id); if (s) s.pos = i; });
      mutSeq++;
      render();
      try {
        await jpost('/api/library/reorder', {ids});
      } catch (err) {
        for (const s of sessions) { if (was.has(s.id)) s.pos = was.get(s.id); }
        mutSeq++;
        render();
        _toast('⚠️ Not reordered: ' + String(err && err.message || err).slice(0, 60), 5000);
      }
    }

    /* ── Delete (archived topics only): one click, no confirm — the server
       moves the transcript to trash, so it can be recovered. ── */
    async function del(id) {
      const i = sessions.findIndex(s => s.id === id);
      if (i < 0) return;
      const s = sessions[i];
      sessions.splice(i, 1);
      mutSeq++;
      render();
      try {
        await jpost('/api/library/delete', {id});
        _toast('Deleted — transcript moved to trash', 3000);
      } catch (err) {
        if (!byId(id)) sessions.splice(Math.min(i, sessions.length), 0, s);
        mutSeq++;
        render();
        _toast('⚠️ Not deleted: ' + String(err && err.message || err).slice(0, 60), 5000);
      }
    }

    let _frameFocus = null;
    document.addEventListener('click', e => {
      const wrap = document.getElementById('wrap');
      if (_frameFocus && wrap.contains(e.target)) _frameFocus();
    });

    function pick(id) {
      if (!ID_RE.test(id)) return;
      sel = id;
      document.getElementById('topbar').style.display = 'flex';
      setLabel(id, true);
      syncSel();
      // a topic still running in an old numbered terminal opens there (the
      // server refuses a second Claude on the same conversation)
      const row = sessions.find(s => s.id === id);
      const legacy = row && typeof row.legacy_path === 'string' && /^\/terminal\d*\/$/.test(row.legacy_path) ? row.legacy_path : null;
      openFrame(legacy || ('/sess/?arg=' + id));
    }

    // cmd button / "Command line" row: the server starts the shell if needed
    // and every tab attaches to the same one
    let _shellSeenUp = false;  // the open shell frame's shell has been reported running

    // back to "Pick a terminal on the left" (the shell was closed or exited)
    function showPlaceholder() {
      sel = null;
      _shellSeenUp = false;
      const wrap = document.getElementById('wrap');
      const f = wrap.querySelector('iframe'); if (f) f.remove();
      if (!document.getElementById('ph')) {
        const ph = document.createElement('div');
        ph.className = 'ph'; ph.id = 'ph'; ph.textContent = 'Pick a terminal on the left';
        wrap.appendChild(ph);
      }
      document.getElementById('topbar').style.display = 'none';
      _frameFocus = null;
      syncSel();
    }

    function pickShell() {
      sel = SHELL;
      _shellSeenUp = !!(shellState && shellState.active);
      document.getElementById('topbar').style.display = 'flex';
      setLabel('cmd');
      syncSel();
      openFrame(SHELL_PATH);
      if (!(shellState && shellState.active)) setTimeout(poll, 1500);   // show its row
    }

    // session: a terminal's 8-hex id -> the board opens filtered to its tasks
    function openTasks(session) {
      tasksOpen = true;
      saveTasksOpen();
      sel = TASKS;
      document.getElementById('topbar').style.display = 'flex';
      setLabel('tasks');
      render();
      syncSel();
      openFrame(ID_RE.test(session || '') ? TASKS_PATH + '?session=' + session : TASKS_PATH, true);
    }

    // top-bar label; a terminal's id there is a link to that terminal's tasks
    function setLabel(text, isTerminal) {
      const l = document.getElementById('tNum');
      l.textContent = text;
      l.classList.toggle('link', !!isTerminal);
      if (isTerminal) l.title = "Show this terminal's tasks"; else l.removeAttribute('title');
    }
    document.getElementById('tNum').addEventListener('click', () => {
      if (ID_RE.test(sel || '')) openTasks(sel);
    });

    // The task board (same origin, in our iframe or standalone via /?open=<id>)
    // asks to open a terminal by its code. Same rule as a list click: a known,
    // non-archived terminal opens even if the search hides its row.
    function openTerminalById(id) {
      if (!ID_RE.test(id || '')) return;
      const s = byId(id);
      if (!s) { _toast('Terminal ' + id + ' not found', 3000); return; }
      if (s.archived) { _toast('Archived terminal — click Restore to open it', 3000); return; }
      pick(id);
    }
    window.addEventListener('message', e => {
      if (e.origin !== location.origin) return;
      const d = e.data;
      if (!d || typeof d !== 'object' || d.type !== 'agentdeck:open-terminal') return;
      if (typeof d.id !== 'string' || !ID_RE.test(d.id)) return;
      openTerminalById(d.id);
    });
    // ?open=<id>: honoured once the first list arrives, then dropped from the URL
    let _pendingOpen = null;
    try {
      const u = new URL(location.href);
      if (u.searchParams.has('open')) {
        const v = u.searchParams.get('open') || '';
        if (ID_RE.test(v)) _pendingOpen = v;
        u.searchParams.delete('open');
        history.replaceState(history.state, '', u.pathname + (u.search === '?' ? '' : u.search) + u.hash);
      }
    } catch {}

    function closeTasks() {
      tasksOpen = false;
      saveTasksOpen();
      if (sel === TASKS) showPlaceholder();
      render();
    }

    document.getElementById('tasksBtn').addEventListener('click', e => {
      if (e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return;   // new tab/window: browser default
      e.preventDefault();
      openTasks();
    });
    tasksRow.addEventListener('click', e => {
      if (e.target.closest('.tasks-close')) return;
      openTasks();
    });
    tasksRow.querySelector('.tasks-close').addEventListener('click', e => {
      e.stopPropagation();
      closeTasks();
    });

    function openServer() {
      serverOpen = true;
      saveServerOpen();
      sel = SERVER;
      document.getElementById('topbar').style.display = 'flex';
      setLabel('server');
      render();
      syncSel();
      openFrame(SERVER_PATH, true);
    }

    function closeServer() {
      serverOpen = false;
      saveServerOpen();
      if (sel === SERVER) showPlaceholder();
      render();
    }

    document.getElementById('serverBtn').addEventListener('click', e => {
      if (e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return;   // new tab/window: browser default
      e.preventDefault();
      openServer();
    });
    serverRow.addEventListener('click', e => {
      if (e.target.closest('.server-close')) return;
      openServer();
    });
    serverRow.querySelector('.server-close').addEventListener('click', e => {
      e.stopPropagation();
      closeServer();
    });

    // plain = a web page (the task board), not a terminal: no ttyd helpers
    function openFrame(path, plain) {
      document.getElementById('tOpen').href = path;
      const wrap = document.getElementById('wrap');
      const ph = document.getElementById('ph'); if (ph) ph.remove();
      const old = wrap.querySelector('iframe'); if (old) old.remove();
      const f = document.createElement('iframe'); f.src = path;
      wrap.appendChild(f);
      if (plain) { _frameFocus = null; return; }
      if (_isMobile) enableIframeTouchScroll(f);
      if (!_isMobile) enableClipboardCopy(f);
      enablePasteImage(f);
      suppressContextMenu(f);
      const doFocus = () => { try { f.focus(); f.contentWindow?.focus(); } catch(e) {} };
      f.addEventListener('load', doFocus);
      f.addEventListener('mousedown', doFocus);
      _frameFocus = doFocus;
    }

    /* ── Mobile input bar ── */
    function sendToTerminal(text) {
      try {
        const f = document.querySelector('#wrap iframe');
        if (!f) return;
        const term = f.contentWindow.term;
        if (!term) return;
        if (typeof term.input === 'function') { term.input(text); return; }
        try { term._core.coreService.triggerDataEvent(text); return; } catch(e) {}
        try { term._core._onData.fire(text); return; } catch(e) {}
      } catch(e) {}
    }

    const mobText = document.getElementById('mobText');
    document.getElementById('mobSend').addEventListener('click', () => {
      const text = mobText.value;
      sendToTerminal(text ? text + '\r' : '\r');
      mobText.value = '';
      mobText.focus();
    });
    mobText.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('mobSend').click(); }
    });
    document.getElementById('mobEsc').addEventListener('click', () => {
      sendToTerminal('\x03');
      mobText.value = '';
      mobText.focus();
    });
    /* ── Cursor arrows: send ANSI sequences. preventDefault stops the click
       from stealing focus from the iframe, so repeated taps keep working. ── */
    const ARROW_KEYS = {
      mobLeft:  '\x1b[D',
      mobRight: '\x1b[C',
      mobUp:    '\x1b[A',
      mobDown:  '\x1b[B',
    };
    for (const [id, seq] of Object.entries(ARROW_KEYS)) {
      const btn = document.getElementById(id);
      if (!btn) continue;
      btn.addEventListener('mousedown', e => e.preventDefault());
      btn.addEventListener('click', e => {
        e.preventDefault();
        sendToTerminal(seq);
      });
    }

    /* ── Esc button: send Escape key to terminal iframe ── */
    document.getElementById('tEsc').addEventListener('click', () => {
      try {
        const f = document.querySelector('#wrap iframe');
        if (!f) return;
        const win = f.contentWindow;
        const term = win.term;
        if (term) {
          if (typeof term.input === 'function') { term.input('\x1b'); return; }
          try { term._core.coreService.triggerDataEvent('\x1b'); return; } catch(e) {}
          try { term._core._onData.fire('\x1b'); return; } catch(e) {}
        }
        const doc = f.contentDocument || win.document;
        const el = doc.querySelector('.xterm-helper-textarea') || doc.activeElement || doc.body;
        el.dispatchEvent(new KeyboardEvent('keydown', {key:'Escape',code:'Escape',keyCode:27,which:27,bubbles:true}));
      } catch(e) {}
    });

    /* ── ⋯ account menu: opens on click/Enter/Space, closes on outside click,
       Esc (focus back to ⋯), Tab out of it, or when focus goes into the terminal. ── */
    (function accountMenu() {
      const btn = document.getElementById('tMenu');
      const menu = document.getElementById('tMenuList');
      const items = () => [...menu.querySelectorAll('[role=menuitem]')];
      const isOpen = () => !menu.hidden;
      function open(focusFirst) {
        menu.hidden = false;
        btn.setAttribute('aria-expanded', 'true');
        if (focusFirst) items()[0].focus();
      }
      function close(refocus) {
        if (!isOpen()) return;
        menu.hidden = true;
        btn.setAttribute('aria-expanded', 'false');
        if (refocus) btn.focus();
      }
      btn.addEventListener('click', e => {
        e.stopPropagation();
        if (isOpen()) close(false);
        else open(e.detail === 0);            // keyboard "click" (Enter/Space) → focus first item
      });
      btn.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown') { e.preventDefault(); open(true); }
      });
      menu.addEventListener('keydown', e => {
        const list = items(), i = list.indexOf(document.activeElement);
        if (e.key === 'Escape') { e.preventDefault(); close(true); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); list[(i + 1) % list.length].focus(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); list[(i - 1 + list.length) % list.length].focus(); }
        else if (e.key === 'Home') { e.preventDefault(); list[0].focus(); }
        else if (e.key === 'End') { e.preventDefault(); list[list.length - 1].focus(); }
      });
      document.getElementById('tAcct').addEventListener('focusout', e => {
        if (!e.relatedTarget || !document.getElementById('tAcct').contains(e.relatedTarget)) close(false);
      });
      document.addEventListener('click', e => {
        if (isOpen() && !document.getElementById('tAcct').contains(e.target)) close(false);
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && isOpen()) close(true);
      });
      window.addEventListener('blur', () => close(false));   // focus went into the terminal iframe
    })();

    /* ── Dark / Light theme (⋯ menu). Stored in localStorage 'agentdeck-theme'
       (same origin as the Tasks and Server pages, which follow it live through
       the storage event); the <head> script applies it before first paint. ── */
    (function themeSwitch() {
      const KEY = 'agentdeck-theme';
      const item = document.getElementById('tTheme');
      const current = () => document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
      function apply(t) {
        document.documentElement.dataset.theme = t;
        item.textContent = t === 'light' ? 'Dark theme' : 'Light theme';
      }
      apply(current());
      item.addEventListener('click', e => {
        e.stopPropagation();
        const t = current() === 'light' ? 'dark' : 'light';
        apply(t);
        try { localStorage.setItem(KEY, t); } catch (err) {}
      });
      window.addEventListener('storage', e => {          // switched in another tab
        if (e.key === KEY) apply(e.newValue === 'light' ? 'light' : 'dark');
      });
    })();

    /* ── 📎 Image: the reliable path — read the clipboard image directly on a
       button click (no fragile paste-event interception inside the ttyd iframe). ── */
    document.getElementById('tPasteImg').addEventListener('click', () => _pasteImageFromClipboard('button'));

    /* ── Mobile: touch→mouse for tmux selection + vertical scroll ── */
    function enableIframeTouchScroll(iframe) {
      iframe.addEventListener('load', () => {
        let attempts = 0;
        const poll = setInterval(() => {
          if (++attempts > 50) { clearInterval(poll); return; }
          try {
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            const screen = doc.querySelector('.xterm-screen');
            if (!screen) return;
            clearInterval(poll);

            let startX = 0, startY = 0, lastY = 0;
            let mode = null; // null | 'scroll' | 'select'
            let accum = 0;
            const _mobBufUrl = location.origin + '/api/tmux-buffer/?session=global';
            const _mobReadBuf = async () => {
              try { return (await (await fetch(_mobBufUrl)).json()).text || ''; } catch { return ''; }
            };
            let _mobAnchor = Promise.resolve('');   // buffer snapshot before a selection
            let _mobGen = 0;                        // supersede older poll loops

            screen.addEventListener('touchstart', e => {
              if (e.touches.length !== 1) return;
              const t = e.touches[0];
              startX = t.clientX;
              startY = lastY = t.clientY;
              mode = null;
              accum = 0;
              _mobAnchor = _mobReadBuf();           // anchor for the off-by-one fix
              screen.dispatchEvent(new MouseEvent('mousedown', {
                clientX: t.clientX, clientY: t.clientY,
                button: 0, bubbles: true
              }));
            }, {passive: true});

            screen.addEventListener('touchmove', e => {
              if (e.touches.length !== 1) return;
              const t = e.touches[0];
              const dx = Math.abs(t.clientX - startX);
              const dy = Math.abs(t.clientY - startY);

              if (!mode && (dx > 8 || dy > 8)) {
                mode = dy > dx ? 'scroll' : 'select';
              }
              if (!mode) return;

              if (mode === 'select') {
                screen.dispatchEvent(new MouseEvent('mousemove', {
                  clientX: t.clientX, clientY: t.clientY,
                  button: 0, buttons: 1, bubbles: true
                }));
                e.preventDefault();
              } else {
                const dv = lastY - t.clientY;
                lastY = t.clientY;
                accum += dv;
                const lines = Math.trunc(accum / 20);
                if (lines !== 0) {
                  accum -= lines * 20;
                  const count = Math.abs(lines);
                  const rect = screen.getBoundingClientRect();
                  const WE = iframe.contentWindow.WheelEvent;
                  for (let i = 0; i < count; i++) {
                    screen.dispatchEvent(new WE('wheel', {
                      deltaY: lines > 0 ? 120 : -120,
                      deltaMode: 0, bubbles: true, cancelable: true,
                      clientX: rect.left + rect.width / 2,
                      clientY: rect.top + rect.height / 2
                    }));
                  }
                }
                e.preventDefault();
              }
            }, {passive: false});

            screen.addEventListener('touchend', e => {
              if (mode === 'select') {
                const t = e.changedTouches[0];
                screen.dispatchEvent(new MouseEvent('mouseup', {
                  clientX: t.clientX, clientY: t.clientY,
                  button: 0, bubbles: true
                }));
                // poll until the buffer reflects the NEW selection (not the previous
                // one) — same off-by-one fix as the desktop path
                const myGen = ++_mobGen;
                (async () => {
                  const anchor = await _mobAnchor;
                  let last = '';
                  for (let i = 0; i < 20; i++) {
                    if (myGen !== _mobGen) return;           // a newer selection took over
                    await new Promise(r => setTimeout(r, 80));
                    const txt = await _mobReadBuf();
                    if (txt && txt.trim()) {
                      last = txt;
                      if (txt !== anchor) { navigator.clipboard.writeText(txt).catch(() => {}); return; }
                    }
                  }
                  // re-selected identical text → copy it anyway rather than no-op
                  if (last && last.trim()) navigator.clipboard.writeText(last).catch(() => {});
                })();
              }
              mode = null;
            }, {passive: true});

          } catch(e) { clearInterval(poll); }
        }, 100);
      });
    }

    /* ── Clipboard: after mouse selection in tmux, copy buffer to system clipboard ── */
    // Right-clicking the terminal popped the browser's native context menu — newer ttyd
    // (xterm.js 5.x client) doesn't preventDefault it the way the older client did. Quiet it
    // on the same-origin terminal iframe (capturing listener on its document) so right-click
    // stays out of the way, regardless of the installed ttyd version.
    function suppressContextMenu(iframe) {
      iframe.addEventListener('load', () => {
        try {
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          doc.addEventListener('contextmenu', e => e.preventDefault(), true);
        } catch (e) { /* cross-origin (shouldn't happen) — ignore */ }
      });
    }

    function enableClipboardCopy(iframe) {
      iframe.addEventListener('load', () => {
        let attempts = 0;
        const poll = setInterval(() => {
          if (++attempts > 50) { clearInterval(poll); return; }
          try {
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            if (!doc.querySelector('.xterm')) return;
            clearInterval(poll);
            const bufUrl = location.origin + '/api/tmux-buffer/?session=global';
            const readBuf = async () => {
              try { return (await (await fetch(bufUrl)).json()).text || ''; } catch { return ''; }
            };
            // Snapshot the tmux buffer as the selection STARTS. `tmux show-buffer`
            // lags one selection behind the mouseup (browser→ttyd→tmux round-trip),
            // so on copy we must wait until the buffer differs from this pre-selection
            // anchor — otherwise we'd grab the PREVIOUS selection (the off-by-one bug
            // where you had to copy twice to paste the current text).
            let anchorPromise = Promise.resolve(''), _downX = 0, _downY = 0, _gen = 0;
            doc.addEventListener('mousedown', (e) => { _downX = e.clientX; _downY = e.clientY; anchorPromise = readBuf(); });
            doc.addEventListener('mouseup', (e) => {
              // only a real drag is a selection — a plain click shouldn't touch the clipboard
              if (Math.abs(e.clientX - _downX) < 4 && Math.abs(e.clientY - _downY) < 4) return;
              const myGen = ++_gen;                          // supersede any older poll loop
              try { window.focus(); } catch (_) {}           // clipboard.write needs a focused doc
              // ClipboardItem with a Promise lets write() run inside the gesture while the
              // text resolves async. CRITICAL: it must resolve FAST — real Chrome aborts the
              // write if the promise hangs ~>1s. So poll the tmux buffer only briefly (~700ms),
              // take the first value that differs from the pre-selection anchor (the NEW
              // selection), and ALWAYS resolve with something so copy never silently fails.
              const textPromise = new Promise((resolve) => {
                (async () => {
                  const anchor = await anchorPromise;        // buffer BEFORE this selection
                  let last = '';
                  for (let i = 0; i < 14; i++) {             // ~700ms max, 50ms steps
                    const t = await readBuf();
                    if (t && t.trim()) {
                      last = t;
                      if (t !== anchor) { resolve(new Blob([t], {type: 'text/plain'})); return; }  // new selection landed
                    }
                    if (myGen !== _gen) break;               // a newer selection took over
                    await new Promise(r => setTimeout(r, 50));
                  }
                  resolve(new Blob([last], {type: 'text/plain'}));   // fallback: copy current buffer (never reject)
                })();
              });
              try {
                navigator.clipboard.write([
                  new ClipboardItem({'text/plain': textPromise})
                ]).catch(() => {
                  // some browsers don't support a Promise ClipboardItem → writeText fallback
                  textPromise.then(b => b.text()).then(t => t && navigator.clipboard.writeText(t).catch(() => {}));
                });
              } catch (_) {
                textPromise.then(b => b.text()).then(t => t && navigator.clipboard.writeText(t).catch(() => {}));
              }
            });
          } catch(e) { clearInterval(poll); }
        }, 100);
      });
    }

    /* ── Paste / drop an image into the terminal: a ttyd/tmux terminal is text-only,
       so an image can't be pasted. Upload it, then type the saved file PATH into the
       terminal — Claude Code auto-attaches the image path as [Image]. Visible toasts
       so it's obvious what happened; handlers on BOTH the iframe and the parent doc
       (the paste fires wherever focus is). ── */
    function _toast(msg, ms) {
      let t = document.getElementById('_imgToast');
      if (!t) {
        t = document.createElement('div'); t.id = '_imgToast';
        t.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99999;' +
          'background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:9px 14px;' +
          'font:13px/1.3 Inter,system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .15s;pointer-events:none';
        document.body.appendChild(t);
      }
      t.textContent = msg; t.style.opacity = '1';
      clearTimeout(t._h); t._h = setTimeout(() => { t.style.opacity = '0'; }, ms || 2600);
    }

    // diagnostics disabled now that image paste works (kept as a no-op so the call
    // sites stay harmless; flip the body back on to debug again)
    function _clientlog() {}

    function _imageFromData(dt) {
      const items = (dt && dt.items) || [];
      for (const it of items) { if (it.kind === 'file' && (it.type || '').startsWith('image/')) return it.getAsFile(); }
      const files = (dt && dt.files) || [];
      for (const fl of files) { if ((fl.type || '').startsWith('image/')) return fl; }
      return null;
    }

    // read the clipboard image directly (used by the 📎 button AND the Ctrl+V hotkey)
    async function _pasteImageFromClipboard(src) {
      _clientlog({ ev: 'read-start', src: src || '?', hasAPI: !!(navigator.clipboard && navigator.clipboard.read), focused: document.hasFocus() });
      if (!navigator.clipboard || !navigator.clipboard.read) {
        _toast('⚠️ Browser can\'t read the clipboard — drag an image file onto the terminal', 5000); return;
      }
      try { window.focus(); } catch (_) {}              // clipboard.read() needs a focused doc
      _toast('📎 Reading clipboard…', 8000);
      try {
        const items = await navigator.clipboard.read();
        let blob = null; const allTypes = [];
        for (const it of items) {
          (it.types || []).forEach(t => allTypes.push(t));
          const type = (it.types || []).find(t => t.startsWith('image/'));
          if (type) { blob = await it.getType(type); break; }
        }
        _clientlog({ ev: 'read-done', src: src || '?', types: allTypes, gotImage: !!blob });
        if (!blob) {
          _toast('⚠️ No image in clipboard. Types: ' + (allTypes.join(', ') || 'none'), 6000);
          return;
        }
        await _uploadAndInsertImage(blob);
      } catch (e) {
        _clientlog({ ev: 'read-error', src: src || '?', error: String(e && e.message || e) });
        _toast('⚠️ Clipboard: ' + String(e && e.message || e).slice(0, 70), 6000);
      }
    }

    // Ctrl+V (no Shift) → paste image from the BROWSER clipboard. Claude Code binds
    // Ctrl+V to image paste but reads the SERVER's (empty) clipboard; we intercept it
    // in the browser and read the real one. Ctrl+Shift+V stays the terminal's text paste.
    function _onTermKeydown(e, scope) {
      if (!e.ctrlKey || e.altKey || e.metaKey) return;
      if ((e.key || '').toLowerCase() !== 'v') return;
      _clientlog({ ev: 'ctrlv-seen', scope: scope || 'iframe', shift: e.shiftKey });
      if (e.shiftKey) return;                         // Ctrl+Shift+V = text paste, leave it
      // on the parent, don't hijack Ctrl+V in real text fields (project name, etc.)
      if (scope === 'parent') {
        const t = e.target, tag = (t && t.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || (t && t.isContentEditable)) return;
      }
      e.preventDefault(); e.stopPropagation();
      if (e.stopImmediatePropagation) e.stopImmediatePropagation();
      _clientlog({ ev: 'ctrlv-keydown', scope: scope || 'iframe' });
      _pasteImageFromClipboard('ctrlv-' + (scope || 'iframe'));
    }
    // page-level Ctrl+V (focus on the dashboard / a button, not inside the terminal)
    document.addEventListener('keydown', (e) => _onTermKeydown(e, 'parent'), true);

    async function _uploadAndInsertImage(blob) {
      const f = document.querySelector('#wrap iframe');
      _clientlog({ ev: 'upload-start', size: blob && blob.size, type: blob && blob.type, hasTerminal: !!f });
      if (!f) { _toast('⚠️ Select a terminal first'); return; }
      _toast('📎 Uploading image…', 10000);
      try {
        const r = await fetch('/api/paste-image', {
          method: 'POST', headers: { 'Content-Type': blob.type || 'image/png' },
          body: blob, credentials: 'same-origin',
        });
        if (!r.ok) { _clientlog({ ev: 'upload-http-fail', status: r.status }); _toast('⚠️ Upload error (HTTP ' + r.status + ')'); return; }
        const d = await r.json();
        if (!d || !d.path) { _toast('⚠️ Server returned no path'); return; }
        // ttyd's xterm has no .input(); term.paste() is the proper API, _onData.fire fallback
        const term = f.contentWindow.term;
        const text = d.path + ' ';
        let how = 'none';
        if (term && typeof term.paste === 'function') { term.paste(text); how = 'paste'; }
        else if (term && typeof term.input === 'function') { term.input(text); how = 'input'; }
        else if (term && term._core && term._core._onData) { try { term._core._onData.fire(text); how = 'onData'; } catch (_) {} }
        _clientlog({ ev: 'inserted', path: d.path, how: how, hasTerm: !!term });
        if (how === 'none') { _toast('⚠️ Terminal not ready'); return; }
        // restore focus to the terminal's INPUT (not just the iframe window) so Enter
        // sends immediately — the button click / Ctrl+V had moved focus away.
        const refocus = () => {
          try { f.contentWindow.focus(); } catch (_) {}
          try { if (term && typeof term.focus === 'function') term.focus(); } catch (_) {}
          try {
            const ta = (f.contentDocument || f.contentWindow.document).querySelector('.xterm-helper-textarea');
            if (ta) ta.focus();
          } catch (_) {}
        };
        refocus();
        setTimeout(refocus, 60);                        // again after the gesture settles
        _toast('✅ Image pasted');
      } catch (e) { _clientlog({ ev: 'upload-error', error: String(e && e.message || e) }); _toast('⚠️ ' + String(e && e.message || e).slice(0, 50)); }
    }

    function _onImagePaste(e) {
      const blob = _imageFromData(e.clipboardData);
      _clientlog({ ev: 'paste-event', gotImage: !!blob, types: e.clipboardData ? Array.from(e.clipboardData.types || []) : 'null' });
      if (!blob) return;                              // not an image → let the terminal paste text
      e.preventDefault(); e.stopPropagation();
      _uploadAndInsertImage(blob);
    }

    // catch the paste wherever focus is: parent document … (image pastes only — text
    // pastes pass through; NO global Ctrl+V keydown intercept here, or it would hijack
    // text paste in dashboard inputs — that's bound only inside the terminal iframe).
    document.addEventListener('paste', _onImagePaste, true);
    window.addEventListener('drop', (e) => {
      const blob = _imageFromData(e.dataTransfer);
      if (!blob) return;
      e.preventDefault(); _uploadAndInsertImage(blob);
    }, true);
    window.addEventListener('dragover', (e) => { if (e.dataTransfer) e.preventDefault(); }, true);

    // … and inside the terminal iframe (focus is usually there). Attach on load AND
    // immediately (the iframe may already be loaded when this runs), and mark the doc
    // so we never double-bind.
    function enablePasteImage(iframe) {
      const attach = () => {
        let attempts = 0;
        const poll = setInterval(() => {
          if (++attempts > 80) { clearInterval(poll); return; }
          try {
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            if (!doc || !doc.querySelector('.xterm')) return;
            clearInterval(poll);
            if (doc.__pasteImgBound) return;
            doc.__pasteImgBound = true;
            _clientlog({ ev: 'iframe-bound' });
            doc.addEventListener('paste', _onImagePaste, true);
            doc.addEventListener('keydown', (e) => _onTermKeydown(e, 'iframe'), true);   // Ctrl+V image hotkey inside the terminal
            doc.addEventListener('drop', (e) => {
              const blob = _imageFromData(e.dataTransfer);
              if (!blob) return;
              e.preventDefault(); e.stopPropagation(); _uploadAndInsertImage(blob);
            }, true);
            doc.addEventListener('dragover', (e) => { if (e.dataTransfer) e.preventDefault(); }, true);
          } catch (e) { clearInterval(poll); }
        }, 100);
      };
      iframe.addEventListener('load', attach);
      attach();   // in case it's already loaded
    }

    function syncTop(s) {
      const el = document.getElementById('tInfo');
      const st = s.archived ? 'archived' : !s.active ? (s.id === SHELL ? 'starting' : 'unloaded')
               : s.status === 'working' ? 'working' : 'idle';
      el.innerHTML = s.name ? '<b>' + esc(s.name) + '</b> &mdash; ' + st : '';
    }

    function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

    function setSystem(s) {
      document.getElementById('cpuVal').textContent = s.cpu_pct + '%';
      const gb = mb => (mb / 1000).toFixed(1);       // 13829/23460 MB -> 13.8/23.5G
      document.getElementById('ramVal').textContent = gb(s.ram_used_mb) + '/' + gb(s.ram_total_mb) + 'G';
      document.getElementById('cpuStat').className = 'stat' + (s.cpu_pct > 90 ? ' crit' : s.cpu_pct > 70 ? ' warn' : '');
      document.getElementById('ramStat').className = 'stat' + (s.ram_pct > 90 ? ' crit' : s.ram_pct > 70 ? ' warn' : '');
    }

    // CPU/RAM: taken from /api/library when it carries `_system`; otherwise from
    // the old status endpoint (read for `_system` only — nothing slot-related).
    let _sysTick = 0;
    async function pollSystem() {
      try {
        const r = await fetch('/api/terminal-status');
        if (!r.ok) return;
        const d = await r.json();
        if (d && d._system) setSystem(d._system);
      } catch {}
    }

    async function poll() {
      const seq = mutSeq;
      try {
        const r = await fetch('/api/library?archived=1',
                              {cache: 'no-store', credentials: 'same-origin'});
        if (!r.ok) return;                       // 401/5xx → skip this tick, don't churn
        const d = await r.json();
        if (d && d._system) setSystem(d._system);
        else if (_sysTick++ % 2 === 0) pollSystem();
        const sh = d && d.shell;
        if (seq === mutSeq) shellState = sh && typeof sh === 'object'
          ? {active: sh.active === true, attached: sh.attached === true,
             status: sh.status === 'working' ? 'working' : 'idle'}
          : null;
        // the open shell ended (`exit` typed in it): drop its frame. Only once it
        // had been seen running — right after cmd it is still starting.
        if (seq === mutSeq && sel === SHELL) {
          if (shellState && shellState.active) _shellSeenUp = true;
          else if (_shellSeenUp) showPlaceholder();
        }
        if (!d || !Array.isArray(d.sessions)) { render(); syncSel(); return; }
        if (seq !== mutSeq) return;              // a local change raced this poll — next one is fresh
        sessions = d.sessions
          .filter(s => s && ID_RE.test(s.id))
          .map(s => Object.assign({}, s, {name: String(s.name ?? '')}));
        render();
        syncSel();
        if (_pendingOpen) { const id = _pendingOpen; _pendingOpen = null; openTerminalById(id); }
      } catch {}
    }
    poll(); setInterval(poll, 4000);

    // Live-reload: reload ONLY when the page file's version genuinely changes.
    // Never reload on a non-OK response (e.g. a 401 HTML body) or a non-numeric
    // body — doing that turned a single transient auth hiccup into a reload +
    // login-prompt storm ("dozens of prompts, everything hangs"). Keep polling so
    // it self-heals when auth recovers; only a real, changed mtime triggers a reload.
    let _v = null;
    setInterval(async () => {
      try {
        const r = await fetch('/api/page-version', {cache: 'no-store'});
        if (!r.ok) return;                            // 401/5xx → never reload
        const v = (await r.text()).trim();
        if (!/^[0-9]+(\.[0-9]+)?$/.test(v)) return;   // only a real mtime is a valid version
        if (_v && v !== _v) location.reload();
        _v = v;
      } catch { /* network blip — ignore, never reload on error */ }
    }, 1500);
  </script>
</body>
</html>
