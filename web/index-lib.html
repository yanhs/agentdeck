<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AgentKennel</title>
  <!-- Theme before first paint (no dark flash on a light choice). -->
  <!-- theme: 'agentkennel-theme', else 'agentdeck-theme' (its name before v2.1.0) -->
  <script>(function(){var t='dark';try{if((localStorage.getItem('agentkennel-theme')||localStorage.getItem('agentdeck-theme'))==='light')t='light';}catch(e){}document.documentElement.dataset.theme=t;})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Palette. Dark is the default (and the look the page always had);
       <html data-theme="light"> swaps in the light one. The terminal iframe
       itself stays dark in both — only the frame around it follows. */
    :root {
      --bg: #09090b; --panel: #0c0c0f; --menu-bg: #111114; --input-bg: #18181b;
      --text: #e4e4e7; --text-hi: #fafafa; --text-2: #d4d4d8;
      --dim: #a1a1aa; --faint: #71717a; --ghost: #52525b; --ghost-2: #3f3f46; --ph: #27272a;
      --dot-off: #3f3f46; --scroll: #222;
      --fg-rgb: 255,255,255;          /* hairlines and hover tints: white on dark */
      --accent: #818cf8; --accent-fg: #c7d2fe; --accent-fg-hi: #e0e7ff; --accent-on: #a5b4fc;
      --accent-fg-dim: rgba(165,180,252,0.55);
      --amber: #fbbf24; --green: #4ade80; --red: #f87171;
      --red-fg: #fca5a5; --red-fg-hi: #fecaca; --red-fg-dim: rgba(252,165,165,0.55);
      --green-fg: #86efac; --green-fg-hi: #bbf7d0; --green-fg-dim: rgba(134,239,172,0.55);
      --card-btn-fg: rgba(161,161,170,0.55);
      --menu-shadow: 0 8px 24px rgba(0,0,0,0.55);
    }
    :root[data-theme="light"] {
      /* slightly muted, not stark white (owner): sidebar a touch deeper than the main area */
      --bg: #f1f1f3; --panel: #e9e9ec; --menu-bg: #f7f7f8; --input-bg: #f7f7f8;
      --text: #18181b; --text-hi: #09090b; --text-2: #27272a;
      --dim: #52525b; --faint: #63636b; --ghost: #63636b; --ghost-2: #a1a1aa; --ph: #a1a1aa;
      --dot-off: #a1a1aa; --scroll: #c4c4ca;
      --fg-rgb: 24,24,27;             /* black-ish tints on white */
      --accent: #4f46e5; --accent-fg: #4338ca; --accent-fg-hi: #3730a3; --accent-on: #4f46e5;
      --accent-fg-dim: rgba(79,70,229,0.7);
      --amber: #d97706; --green: #16a34a; --red: #dc2626;
      --red-fg: #b91c1c; --red-fg-hi: #991b1b; --red-fg-dim: rgba(220,38,38,0.7);
      --green-fg: #15803d; --green-fg-hi: #166534; --green-fg-dim: rgba(21,128,61,0.75);
      --card-btn-fg: rgba(82,82,91,0.75);
      --menu-shadow: 0 8px 24px rgba(24,24,27,0.12);
      color-scheme: light;
    }
    /* light: hairlines a bit stronger than the tinted defaults, for separation */
    :root[data-theme="light"] .sidebar { border-right-color: #d4d4d8; }
    :root[data-theme="light"] .sidebar-header,
    :root[data-theme="light"] .lib-tools,
    :root[data-theme="light"] .side-top,
    :root[data-theme="light"] .topbar { border-bottom-color: #d4d4d8; }
    :root[data-theme="light"] .card { border-bottom-color: #dcdce0; }
    :root[data-theme="light"] .card.first-off,
    :root[data-theme="light"] .card.shell-row,
    :root[data-theme="light"] .card.tasks-row,
    :root[data-theme="light"] .card.server-row { border-color: #cfcfd4; }
    :root[data-theme="light"] .mob-input { border-top-color: #d4d4d8; }
    * { margin: 0; padding: 0; box-sizing: border-box; }


    body {
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      display: flex;
      -webkit-font-smoothing: antialiased;
    }

    .sidebar {
      width: 175px;
      min-width: 175px;
      height: 100vh;
      background: var(--panel);
      border-right: 1px solid rgba(var(--fg-rgb),0.06);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 0.35rem 0.4rem;
      border-bottom: 1px solid rgba(var(--fg-rgb),0.06);
      font-size: 0.7rem;
      font-weight: 400;
      color: var(--text-hi);
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 0.25rem;
    }

    .sys-stats {
      display: flex;
      gap: 0.24rem;
      font-size: 0.53rem;
      font-weight: 400;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      margin-left: auto;
      flex: none;
      white-space: nowrap;
    }

    .sys-stats.hidden .val { display: none; }

    .stat { color: var(--ghost); }
    .stat .val { color: var(--dim); }
    .stat.warn .val { color: var(--amber); }
    .stat.crit .val { color: var(--red); }

    [hidden] { display: none !important; }

    .agent-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; }

    /* ── Library tools: new topic + search ── */
    .lib-tools {
      padding: 0.3rem 0.4rem;
      border-bottom: 1px solid rgba(var(--fg-rgb),0.06);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .lib-tools.creating .new-row, .lib-tools.creating #search { display: none; }
    /* [＋ New terminal][cmd] — cmd opens the one plain command line */
    .new-row { display: flex; gap: 3px; min-width: 0; }
    .new-row .new-btn { flex: 1 1 0; min-width: 0; }
    .new-row .cmd-btn {
      flex: none;
      width: auto;
      padding: 0 7px;
      font-family: 'JetBrains Mono', monospace;
      background: rgba(var(--fg-rgb),0.04);
      border-color: rgba(var(--fg-rgb),0.16);
      color: var(--text-2);
    }
    .new-row .cmd-btn:hover { background: rgba(var(--fg-rgb),0.1); border-color: rgba(var(--fg-rgb),0.3); color: var(--text-hi); }

    .new-btn {
      width: 100%;
      height: 22px;
      background: rgba(99,102,241,0.16);
      border: 1px solid rgba(129,140,248,0.55);
      color: var(--accent-fg);
      font: 500 0.68rem 'Inter', system-ui, sans-serif;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.12s;
    }
    .new-btn:hover { background: rgba(99,102,241,0.3); border-color: var(--accent); color: var(--accent-fg-hi); }
    .new-btn:active { transform: scale(0.98); }

    .lib-input {
      width: 100%;
      min-width: 0;
      height: 22px;
      background: var(--input-bg);
      border: 1px solid rgba(var(--fg-rgb),0.1);
      border-radius: 4px;
      color: var(--text);
      font: 400 0.68rem 'Inter', system-ui, sans-serif;
      padding: 0 6px;
      outline: none;
    }
    .lib-input::placeholder { color: var(--ghost); }
    .lib-input:focus { border-color: rgba(129,140,248,0.55); }

    .new-form { display: flex; gap: 3px; align-items: center; }
    .new-form .lib-input { flex: 1 1 0; }
    .new-form button {
      flex: none;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      border: 1px solid rgba(var(--fg-rgb),0.12);
      background: rgba(var(--fg-rgb),0.04);
      color: var(--dim);
      font-size: 0.72rem;
      cursor: pointer;
    }
    .new-form button[type=submit] { color: var(--green-fg); border-color: rgba(34,197,94,0.35); background: rgba(34,197,94,0.08); }
    .new-form button:disabled { opacity: 0.45; pointer-events: none; }

    .lib-empty { padding: 8px 7px; font-size: 0.64rem; color: var(--ghost); }

    /* ── Card ── */
    .card {
      position: relative;
      cursor: pointer;
      user-select: none;
      padding: 5px 7px;
      border-bottom: 1px solid rgba(var(--fg-rgb),0.04);
      transition: background 0.12s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: rgba(99,102,241,0.15);
    }

    .card:hover { background: rgba(var(--fg-rgb),0.025); }

    .card.sel {
      background: rgba(99,102,241,0.07);
      border-left: 2px solid var(--accent);
      padding-left: 5px;
    }

    /* Unloaded (not in RAM): still one click away, but visibly quieter. */
    .card.unloaded .proj { color: var(--faint); }
    .card.unloaded .sid { color: var(--ghost-2); }
    .card.unloaded:hover .proj { color: var(--dim); }
    /* The first unloaded row after the loaded group draws the seam. */
    .card.first-off { border-top: 1px solid rgba(var(--fg-rgb),0.10); }
    /* The command line: pinned above the topics, no rename/archive/drag. */
    .card.shell-row { border-bottom: 1px solid rgba(var(--fg-rgb),0.10); }
    .card.shell-row .proj { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; }
    .card.tasks-row, .card.server-row { border-bottom: 1px solid rgba(var(--fg-rgb),0.10); }
    .card.tasks-row .proj, .card.server-row .proj { font-weight: 500; }
    .shell-close, .tasks-close, .server-close {
      width: 18px; height: 18px; flex-shrink: 0; padding: 0;
      border: 1px solid rgba(239,68,68,0.12); border-radius: 4px;
      background: rgba(239,68,68,0.05); color: var(--red-fg-dim);
      font-size: 0.62rem; line-height: 16px; text-align: center; cursor: pointer;
      transition: all 0.12s;
    }
    .shell-close:hover, .tasks-close:hover, .server-close:hover { background: rgba(239,68,68,0.16); color: var(--red-fg-hi); border-color: rgba(239,68,68,0.32); }

    .card-top {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .proj {
      flex: 1;
      min-width: 0;
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .proj.empty { color: var(--ghost-2); font-weight: 400; }

    .card-btns {
      display: flex;
      align-items: center;
      gap: 1px;
      flex-shrink: 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .dot.working {
      background: var(--amber);
      box-shadow: 0 0 6px rgba(251,191,36,0.5);
      animation: pulse 2s ease-in-out infinite;
    }

    .dot.idle {
      background: var(--green);
      box-shadow: 0 0 4px rgba(74,222,128,0.3);
    }

    .dot.off { background: var(--dot-off); }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .task {
      font-size: 0.64rem;
      color: var(--ghost);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
      padding-left: 1px;
    }

    .card-btn {
      visibility: visible;
      width: 18px;
      height: 18px;
      border: 1px solid rgba(var(--fg-rgb),0.06);
      border-radius: 4px;
      background: rgba(var(--fg-rgb),0.03);
      color: var(--card-btn-fg);
      font-size: 0.7rem;
      cursor: pointer;
      line-height: 16px;
      text-align: center;
      transition: all 0.12s;
      flex-shrink: 0;
    }
    .card-btn:hover { background: rgba(var(--fg-rgb),0.08); color: var(--text); border-color: rgba(var(--fg-rgb),0.16); }
    .card-btn.edit { color: var(--accent-fg-dim); background: rgba(99,102,241,0.05); border-color: rgba(99,102,241,0.12); }
    .card-btn.edit:hover { background: rgba(99,102,241,0.16); color: var(--accent-fg); border-color: rgba(99,102,241,0.32); }
    .card-btn.del { color: var(--red-fg-dim); background: rgba(239,68,68,0.05); border-color: rgba(239,68,68,0.12); }
    .card-btn.del:hover { background: rgba(239,68,68,0.16); color: var(--red-fg-hi); border-color: rgba(239,68,68,0.32); }
    /* Compact button — same dimensions as other row-1 buttons (22×22),
       with a subtle green tint to stand out as the action button. */
    .card-btn.compact {
      font-weight: 400;
      color: var(--green-fg-dim);
      background: rgba(34,197,94,0.05);
      border-color: rgba(34,197,94,0.12);
    }
    .card-btn.compact:hover {
      background: rgba(34,197,94,0.16);
      border-color: rgba(34,197,94,0.32);
      color: var(--green-fg);
    }
    .card-btn.compact:active { transform: scale(0.94); }
    /* ⟳ Restart (loaded rows only); pulses while the server restarts it */
    .card-btn.restart.busy { cursor: progress; animation: pulse 1s ease-in-out infinite; }
    .trash-btn.busy { cursor: progress; color: var(--red-fg); animation: pulse 1s ease-in-out infinite; }
    /* The page's one question (⟳ Restart, 🗑 Move to Trash, Empty trash): plain,
       or red with "!" (.danger) when the answer interrupts work or erases for good */
    #confirmDlg {
      width: min(360px, calc(100vw - 32px)); max-width: none; padding: 18px 18px 14px;
      margin: auto;                     /* the page's * { margin: 0 } would pin it top-left */
      border: 1px solid rgba(var(--fg-rgb),0.14); border-radius: 12px;
      background: var(--menu-bg); color: var(--text); box-shadow: var(--menu-shadow);
      font-family: 'Inter', sans-serif;
    }
    #confirmDlg::backdrop { background: rgba(0,0,0,0.45); }
    #confirmDlg .dlg-head { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--text-hi); }
    #confirmDlg .dlg-icon { display: none; }
    #confirmDlg p { margin: 8px 0 16px; font-size: 13px; line-height: 1.45; color: var(--dim); }
    #confirmDlg .dlg-btns { display: flex; justify-content: flex-end; gap: 8px; }
    #confirmDlg .dlg-btns button {
      min-height: 38px; padding: 0 14px; border-radius: 8px; cursor: pointer;
      font: 500 13px 'Inter', sans-serif; color: var(--text-2);
      background: transparent; border: 1px solid rgba(var(--fg-rgb),0.14);
    }
    /* .dlg-btns in the selector: it must outweigh the transparent button rule above;
       #4f46e5 keeps white text readable (AA) in both themes */
    #confirmDlg .dlg-btns .dlg-ok { background: #4f46e5; border-color: #4f46e5; color: #fff; }
    #confirmDlg .dlg-btns button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #confirmDlg.danger { border: 2px solid var(--red); }
    #confirmDlg.danger .dlg-head { color: var(--red-fg); }
    #confirmDlg.danger .dlg-icon {
      display: inline-flex; align-items: center; justify-content: center; flex: none;
      width: 28px; height: 28px; border-radius: 50%; background: #dc2626; color: #fff;
      font-weight: 700; font-size: 17px;
    }
    #confirmDlg.danger .dlg-btns .dlg-ok { background: #dc2626; border-color: #dc2626; color: #fff; }

    .proj-edit {
      font-size: 0.72rem;
      background: rgba(var(--fg-rgb),0.06);
      border: 1px solid rgba(129,140,248,0.4);
      border-radius: 3px;
      color: var(--text);
      padding: 1px 4px;
      width: 100%;
      outline: none;
      font-family: inherit;
    }

    /* ── Second row on each card: short session code + archive ── */
    .card-row2 {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 1px 0 0 1px;
    }

    .sid {
      flex: 1;
      min-width: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.56rem;
      color: var(--ghost);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    /* the code under the name opens that terminal's tasks (the rest of the row opens the terminal) */
    .card .sid { flex: 0 1 auto; margin-right: auto; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    .card .sid:hover { text-decoration: underline; color: var(--text, inherit); }

    .arch-btn {
      flex: none;
      height: 15px;
      padding: 0 4px;
      font: 400 0.56rem 'Inter', system-ui, sans-serif;
      line-height: 13px;
      color: var(--ghost);
      background: transparent;
      border: 1px solid rgba(var(--fg-rgb),0.06);
      border-radius: 3px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.12s;
    }
    .arch-btn:hover { color: var(--red-fg); border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.06); }
    /* Manual order: drag rows (desktop); ▲▼ on touch screens. */
    .card[draggable="true"] { -webkit-user-drag: element; }
    .card.dragging { opacity: 0.4; }
    .card.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
    .card.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
    .mv-btn {
      display: none;
      flex: none;
      width: 22px;
      height: 18px;
      padding: 0;
      font: 400 0.6rem 'Inter', system-ui, sans-serif;
      line-height: 16px;
      color: var(--faint);
      background: transparent;
      border: 1px solid rgba(var(--fg-rgb),0.08);
      border-radius: 3px;
      cursor: pointer;
    }
    html.touch .mv-btn { display: inline-block; }
    @media (hover: none) and (pointer: coarse) { .mv-btn { display: inline-block; } }

    /* 🗑 Move to Trash: every terminal row, after Archive (on an archived row, in its place). */
    .trash-btn {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 17px;
      height: 15px;
      padding: 0;
      color: var(--ghost);
      background: transparent;
      border: 1px solid rgba(var(--fg-rgb),0.06);
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.12s;
    }
    .trash-btn svg { width: 9px; height: 9px; display: block; }
    .trash-btn:hover { color: var(--red-fg); border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.06); }

    /* Archived rows (only with "Show archived" on): below the rest, greyed. */
    .card.archived { opacity: 0.5; }
    .card.archived:hover { opacity: 0.8; }
    .card.archived .proj { font-style: italic; }
    .card.first-arch { border-top: 1px dashed rgba(var(--fg-rgb),0.12); }

    .arch-toggle {
      display: block;
      width: 100%;
      margin: 0;
      padding: 6px 7px;
      background: transparent;
      border: none;
      color: var(--ghost);
      font: 400 0.6rem 'Inter', system-ui, sans-serif;
      text-align: left;
      cursor: pointer;
    }
    .arch-toggle:hover { color: var(--dim); }
    .arch-toggle.on { color: var(--accent-on); }
    /* "Show archived" and "Show trash" share the list's last line */
    .list-foot { display: flex; align-items: center; }
    .list-foot .arch-toggle { width: auto; flex: none; }

    /* The trash ("Show trash"): below the list, its own rows — not terminal rows */
    .trash-view { border-top: 1px dashed rgba(var(--fg-rgb),0.12); padding-bottom: 4px; }
    .trash-head { display: flex; align-items: center; gap: 6px; padding: 5px 7px 3px; }
    .trash-title { flex: 1; min-width: 0; font: 500 0.62rem 'Inter', system-ui, sans-serif; color: var(--dim); }
    .trash-row {
      display: flex; align-items: center; gap: 6px; padding: 4px 7px;
      border-bottom: 1px solid rgba(var(--fg-rgb),0.04);
    }
    .trash-info { flex: 1; min-width: 0; }
    .trash-name {
      font-size: 0.72rem; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* code · when trashed: wraps in the narrow sidebar rather than losing the time */
    .trash-row .when {
      font: 400 0.56rem 'JetBrains Mono', monospace; color: var(--dim);
      overflow-wrap: anywhere;
    }
    .restore-btn, .empty-trash {
      flex: none; height: 18px; padding: 0 6px; border-radius: 3px; cursor: pointer;
      font: 500 0.58rem 'Inter', system-ui, sans-serif; white-space: nowrap; transition: all 0.12s;
    }
    .restore-btn { color: var(--accent-fg); background: rgba(99,102,241,0.08); border: 1px solid rgba(129,140,248,0.35); }
    .restore-btn:hover { background: rgba(99,102,241,0.18); }
    .empty-trash { color: var(--red-fg); background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.35); }
    .empty-trash:hover { background: rgba(239,68,68,0.14); }
    .trash-empty { padding: 4px 7px 6px; font-size: 0.62rem; color: var(--faint); }
    .trash-empty.failed { color: var(--red-fg); }

    /* ── Add buttons (inside the sidebar header, next to "Agents") ── */
    .header-add {
      display: flex;
      gap: 3px;
      flex: none;
    }

    /* Icon-only, so the frame is what makes them read as buttons at all. */
    .add-btn {
      background: rgba(99,102,241,0.16);
      border: 1px solid rgba(129,140,248,0.55);
      color: var(--accent-fg);
      font: 500 0.8rem 'Inter', system-ui, sans-serif;
      padding: 0;
      width: 22px;
      height: 20px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.12s;
      line-height: 1;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .add-btn:hover { background: rgba(99,102,241,0.3); border-color: var(--accent); color: var(--accent-fg-hi); }
    .add-btn:active { transform: scale(0.96); }
    .add-btn.disabled { pointer-events: none; opacity: 0.45; }

    /* ⋯ account menu: Telegram / Password / Logout */
    .topbar { position: relative; z-index: 20; }
    .acct { position: relative; flex: none; display: flex; }
    .acct-btn { font-weight: 600; letter-spacing: 0.04em; }
    .acct-btn[aria-expanded="true"] { color: var(--text); border-color: rgba(129,140,248,0.6); background: rgba(99,102,241,0.16); }
    .acct-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 110px;
      padding: 4px;
      background: var(--menu-bg);
      border: 1px solid rgba(var(--fg-rgb),0.14);
      border-radius: 6px;
      box-shadow: var(--menu-shadow);
    }
    .acct-menu[hidden] { display: none; }
    .acct-menu .btn { display: block; text-align: left; padding: 0.3rem 0.5rem; }
    .acct-menu button.btn { width: 100%; font-family: inherit; }
    .acct-menu .btn:focus-visible { outline: 1px solid var(--accent); outline-offset: 0; }
    /* no terminal open: the bar keeps only ⋯ (Password / Theme / Telegram / Logout must be
       reachable on the empty dashboard too); the terminal buttons come back on pick */
    .topbar.no-term > :not(.acct) { display: none; }
    .topbar.no-term .acct { margin-left: auto; }

    .btn-logout { color: var(--red-fg); border-color: rgba(239,68,68,0.28); }
    .btn-logout:hover { color: var(--red-fg-hi); border-color: rgba(239,68,68,0.5); background: rgba(239,68,68,0.12); }

    /* ── Right area ── */
    .main {
      flex: 1;
      min-width: 0;        /* allow main to shrink to viewport-minus-sidebar */
      overflow: hidden;    /* a long top line must never widen the iframe */
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      padding: 0.1rem 0.4rem;
      border-bottom: 1px solid rgba(var(--fg-rgb),0.06);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--panel);
      flex-shrink: 0;
      min-width: 0;        /* don't let topbar content distend .main */
    }

    .topbar-lbl.link { cursor: pointer; }
    .topbar-lbl.link:hover { text-decoration: underline; text-underline-offset: 3px; }
    .topbar-lbl {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      font-weight: 500;
      color: var(--accent);
    }

    .topbar-info {
      flex: 1;
      min-width: 0;        /* required so ellipsis works instead of overflowing */
      font-size: 0.62rem;
      color: var(--faint);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .topbar-info b { color: var(--dim); font-weight: 500; }

    /* Compact, but the frame and contrast have to survive the shrink —
       at 0.46rem on a near-invisible border the row read as plain text. */
    .btn {
      padding: 0.14rem 0.4rem;
      font-size: 0.62rem;
      font-weight: 400;
      color: var(--dim);
      background: rgba(var(--fg-rgb),0.05);
      border: 1px solid rgba(var(--fg-rgb),0.2);
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.12s;
      flex-shrink: 0;
    }

    .btn:hover { color: var(--text); background: rgba(var(--fg-rgb),0.1); border-color: rgba(var(--fg-rgb),0.35); }

    .wrap { flex: 1; position: relative; }

    .wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    .ph {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ph);
      font-size: 0.8rem;
      pointer-events: none;
    }

    /* Files dragged over the terminal: a dashed frame saying they will upload */
    .wrap.drop-files { position: relative; }
    .wrap.drop-files::after {
      content: 'Drop to upload — the path goes into the terminal';
      position: absolute; inset: 6px; z-index: 6;
      display: flex; align-items: center; justify-content: center;
      border: 2px dashed var(--accent); border-radius: 10px;
      background: rgba(0,0,0,0.35); color: #fff; font-size: 0.9rem;
      pointer-events: none;
    }

    /* "Copied" chip after a terminal selection is copied. Never blocks a selection. */
    .copy-hint {
      position: absolute;
      top: 8px;
      right: 14px;
      z-index: 5;
      padding: 3px 9px;
      font-size: 0.66rem;
      color: var(--text-2);
      background: var(--menu-bg);
      border: 1px solid rgba(var(--fg-rgb),0.14);
      border-radius: 999px;
      box-shadow: var(--menu-shadow);
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .copy-hint.show { opacity: 0.9; }

    .agent-list::-webkit-scrollbar { width: 3px; }
    .agent-list::-webkit-scrollbar-track { background: transparent; }
    .agent-list::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 2px; }

    .mob-input { display: none; }

    @media (max-width: 700px) {
      html, body { position: fixed; width: 100%; height: 100%; overflow: hidden; }
      body { flex-direction: column; }
      .sidebar { width: 100%; min-width: 100%; height: auto; max-height: 15vh; }
      .main { height: 85vh; display: flex; flex-direction: column; }
      .wrap { position: static; flex: 1; display: flex; flex-direction: column; }
      .wrap iframe { position: static; inset: auto; width: 100%; height: auto; flex: 1; touch-action: manipulation; }
      .sidebar-header { padding: 4px 10px; font-size: 0.75rem; }
      /* Phone: tools and header share ONE row (the sidebar is only 15vh):
         [＋ New topic][search……][📋][CPU RAM] */
      .side-top { display: flex; align-items: center; border-bottom: 1px solid rgba(var(--fg-rgb),0.06); flex: none; }
      .side-top .sidebar-header { order: 2; flex: none; border-bottom: none; padding: 4px 8px 4px 5px; }
      .lib-tools { order: 1; flex: 1; min-width: 0; flex-direction: row; align-items: center; border-bottom: none; padding: 4px 0 4px 8px; }
      .new-btn { width: auto; flex: none; height: 26px; padding: 0 8px; font-size: 0.72rem; }
      .new-row { flex: none; }
      .new-row .new-btn { flex: none; }
      .new-row .cmd-btn { padding: 0 6px; }
      /* 16px: iOS zooms the page into any input with a smaller font. */
      .lib-input { flex: 1 1 0; height: 26px; font-size: 16px; }
      .new-form { flex: 1; min-width: 0; }
      .new-form button { width: 26px; height: 26px; font-size: 0.8rem; }
      .proj-edit { font-size: 16px; }
      /* One row per session: the card's inner rows dissolve into a single
         flex line — [name……][code][⟳][✎][Archive][🗑][●] (⟳ on loaded rows) */
      .card { display: flex; align-items: center; padding: 3px 8px; cursor: pointer; gap: 5px; }
      .card.sel { padding-left: 6px; }
      .card-top, .card-btns, .card-row2 { display: contents; }
      .proj { order: 1; flex: 1; min-width: 0; font-size: 0.8rem; }
      .sid { order: 2; flex: none; font-size: 0.6rem; }
      .card .sid { flex: none; margin-right: 0; }
      .card-btn.edit, .card-btn.restart { order: 3; }
      .arch-btn { order: 4; height: 20px; line-height: 18px; font-size: 0.64rem; padding: 0 5px; }
      .trash-btn { order: 4; width: 20px; height: 20px; }
      .trash-btn svg { width: 11px; height: 11px; }
      /* thumb-sized in the trash view */
      .restore-btn, .empty-trash { height: 28px; padding: 0 10px; font-size: 0.7rem; }
      .trash-name { font-size: 0.8rem; }
      .trash-row .when { font-size: 0.62rem; }
      .dot { order: 5; }
      .card-btn { visibility: visible; width: 20px; height: 20px; line-height: 18px; font-size: 0.8rem; }
      .shell-close, .tasks-close, .server-close { order: 3; width: 20px; height: 20px; line-height: 18px; font-size: 0.7rem; }
      .task { display: none; }
      /* Compact header buttons on phone. */
      .header-add { gap: 2px; }
      .add-btn { font-size: 0.68rem; padding: 2px 6px; width: 20px; }
      /* The 8-hex code is longer than the old "#N" and would push Logout off
         the phone's topbar; the open topic is highlighted in the list above. */
      .topbar-lbl { display: none; }

      .mob-input {
        display: flex;
        gap: 0;
        background: var(--panel);
        border-top: 1px solid rgba(var(--fg-rgb),0.08);
        flex-shrink: 0;
      }
      .mob-input input {
        flex: 1 1 0;        /* shrink past intrinsic width */
        min-width: 0;       /* without this, the input refuses to shrink and
                               pushes the arrow cluster + ↵ off-screen */
        background: var(--input-bg);
        border: none;
        color: var(--text);
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        padding: 10px 10px;
        outline: none;
      }
      .mob-input input::placeholder { color: var(--ghost-2); }
      .mob-input button {
        background: none;
        border: none;
        color: var(--ghost);
        font-size: 16px;
        padding: 8px 8px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .mob-input button:active { color: var(--accent); }
      /* Brighten ↵ to match the cursor arrows — it's the most-used button. */
      .mob-input #mobSend { color: var(--dim); }
      .mob-input #mobSend:active { color: var(--accent); background: rgba(129,140,248,0.10); }
      /* Key icons are inline SVGs, not font glyphs: Google's latin subset of
         JetBrains Mono has ↑ ↓ but not ← → ↵, so a phone drew those in a
         fallback font at another size (owner, 2026-10-23). */
      .mob-input button svg { display: block; width: 16px; height: 16px; }

      /* Tab + cursor-arrow cluster: 5 compact pills sitting between input and ↵.
         Kept narrow so right-arrow + ↵ stay on-screen even on the smallest
         iPhone widths (≈ 320 CSS px). */
      .mob-arrows {
        display: flex;
        gap: 1px;
        align-items: stretch;
        flex-shrink: 0;
      }
      .mob-arrows .mob-arrow {
        padding: 8px 5px;
        line-height: 1;
        color: var(--dim);
        min-width: 22px;
      }
      .mob-arrows .mob-arrow:active { color: var(--accent); background: rgba(129,140,248,0.10); }
    }
  </style>
</head>
<body>
  <div class="sidebar">

          <a class="add-btn" id="serverBtn" href="/server.html" aria-label="Server status" title="Server status — CPU and memory of agents, sites and jobs (opens here; Ctrl/⌘-click for a new tab)" style="text-decoration:none"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M2.5 12a5.5 5.5 0 0 1 11 0"/><path d="M8 12l2.8-3.6"/></svg></a>
        </div>

        </div>
        <form class="new-form" id="newForm" hidden autocomplete="off">

          <button type="submit" id="newOk" title="Create and open (Enter)">✓</button>

    <div class="lib-empty" id="libEmpty" hidden></div>
    <div class="agent-list" id="list"><div class="list-foot" id="listFoot"><button type="button" class="arch-toggle" id="showArchived" title="Show archived terminals (greyed) so you can restore them">Show archived</button><button type="button" class="arch-toggle" id="showTrash" title="Show the trash: terminals you moved there, to restore them or erase them for good">Show trash</button></div><div class="trash-view" id="trashView" hidden><div class="trash-head"><span class="trash-title" id="trashTitle">Trash</span><button type="button" class="empty-trash" id="emptyTrash" hidden title="Erase every conversation shown here for good">Empty trash</button></div><div id="trashList"></div><div class="trash-empty" id="trashEmpty" hidden>The trash is empty</div></div></div>

      <div class="mob-arrows">
        <button class="mob-arrow" id="mobTab" title="Tab" aria-label="Tab"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8h9M8 5l3 3-3 3M14 4v8"/></svg></button>
        <button class="mob-arrow" id="mobLeft" title="Cursor left" aria-label="Cursor left"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4"/></svg></button>
        <button class="mob-arrow" id="mobUp" title="Cursor up / history" aria-label="Cursor up"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M4 7l4-4 4 4"/></svg></button>
        <button class="mob-arrow" id="mobDown" title="Cursor down / history" aria-label="Cursor down"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v10M4 9l4 4 4-4"/></svg></button>
        <button class="mob-arrow" id="mobRight" title="Cursor right" aria-label="Cursor right"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>

  <script>
    /* ── Session library ──
       The left column is the list of topics (sessions) from GET /api/library,
       in a fixed order — the same as library.display_order: the manual order
       (a new topic on top, dragging changes it). Loaded ones show a status dot,
       unloaded ones are greyed; opening, using, loading or unloading a topic
       never moves it (owner 27.10.2026: the list must not jump).
       A topic is addressed ONLY by its 8-hex code; there are no slot numbers.
       Opening one = iframe /sess/?arg=<code> (the server loads it if needed). */
    const ID_RE = /^[0-9a-f]{8}$/;
    const _isMobile = window.matchMedia('(max-width: 700px)').matches;
    let sel = null;            // code of the open topic
    let sessions = [];         // last /api/library payload (+ local edits)
    let editing = null;        // code whose name is being edited — freezes re-render
    let mutSeq = 0;            // bumped on every local change; a poll that started
                               // before it is stale and must not overwrite it
    const rows = new Map();    // code -> row element (kept across polls)
    const _restarting = new Set();   // codes with a ⟳ restart in flight
    const _trashing = new Set();     // codes with a 🗑 Move to Trash in flight
    const list = document.getElementById('list');
    const search = document.getElementById('search');
    const libTools = document.getElementById('libTools');
    const newBtn = document.getElementById('newBtn');
    const newForm = document.getElementById('newForm');
    const newName = document.getElementById('newName');
    const newOk = document.getElementById('newOk');
    const libEmpty = document.getElementById('libEmpty');
    const archToggle = document.getElementById('showArchived');
    const listFoot = document.getElementById('listFoot');
    const trashToggle = document.getElementById('showTrash');
    const trashView = document.getElementById('trashView');
    /* ── Tasks: the task board as a tab in the viewer (the T button). While it
       is open a "Tasks" row is pinned at the very top; ✕ closes it. Open/closed
       is remembered per browser. `sel === TASKS` = the board is shown. */
    const TASKS = 'tasks';
    const TASKS_PATH = '/tasks/';
    let tasksOpen = false;
    try { tasksOpen = localStorage.getItem('lib-tasks-open') === '1'; } catch {}
    const tasksRow = document.createElement('div');
    tasksRow.className = 'card tasks-row';
    tasksRow.dataset.tasks = '1';
    tasksRow.innerHTML = `
        <div class="card-top">
          <div class="proj">Tasks</div>
          <div class="card-btns">
            <button type="button" class="tasks-close" title="Close task board" aria-label="Close task board">✕</button>
            <span class="dot idle" title="open"></span>
          </div>
        </div>`;
    tasksRow.title = 'Task board — click to show it';
    function saveTasksOpen() {
      try { localStorage.setItem('lib-tasks-open', tasksOpen ? '1' : '0'); } catch {}
    }
    /* ── Server: the server status page (web/server.html) as a tab, exactly like
       Tasks — the gauge button opens it, a pinned "Server" row stays while it is
       open, ✕ closes it; remembered per browser. `sel === SERVER` = it is shown. */
    const SERVER = 'server';
    const SERVER_PATH = '/server.html';
    let serverOpen = false;
    try { serverOpen = localStorage.getItem('lib-server-open') === '1'; } catch {}
    const serverRow = document.createElement('div');
    serverRow.className = 'card server-row';
    serverRow.dataset.server = '1';
    serverRow.innerHTML = `
        <div class="card-top">
          <div class="proj">Server</div>
          <div class="card-btns">
            <button type="button" class="server-close" title="Close server status" aria-label="Close server status">✕</button>
            <span class="dot idle" title="open"></span>
          </div>
        </div>`;
    serverRow.title = 'Server status — click to show it';
    function saveServerOpen() {
      try { localStorage.setItem('lib-server-open', serverOpen ? '1' : '0'); } catch {}
    }
    /* ── cmd: the one plain command line (tmux cmd-shell, /sess/?arg=shell).
       GET /api/library reports it in `shell` (not in sessions[]); while it is
       loaded it is a row pinned above the topics. `sel === SHELL` = it is open. */
    const SHELL = 'shell';
    const SHELL_PATH = '/sess/?arg=shell';
    let shellState = null;     // {active, attached, status} from the last poll
    const shellRow = document.createElement('div');
    shellRow.className = 'card shell-row';
    shellRow.dataset.shell = '1';
    shellRow.innerHTML = `
        <div class="card-top">
          <div class="proj">Command line</div>
          <div class="card-btns">
            <button type="button" class="shell-close" title="Close command line" aria-label="Close command line">✕</button>
            <span class="dot off"></span>
          </div>
        </div>`;
    shellRow.title = 'Command line (bash) — click to open';
    shellRow.addEventListener('click', e => {
      if (e.target.closest('.shell-close')) return;
      pickShell();
    });
    shellRow.querySelector('.shell-close').addEventListener('click', e => {
      e.stopPropagation();
      closeShell();
    });

    // ✕ on the row: one click, no confirm; the row goes at once, back on error
    async function closeShell() {
      const was = shellState;
      shellState = {active: false, attached: false, status: 'off'};
      mutSeq++;                                // a poll in flight still sees it running
      if (sel === SHELL) showPlaceholder();
      render();
      try {
        await jpost('/api/library/shell-close', {});
      } catch (err) {
        shellState = was;
        mutSeq++;
        render();
        _toast('⚠️ Command line not closed: ' + String(err && err.message || err).slice(0, 60), 5000);
      }
    }
    document.getElementById('cmdBtn').addEventListener('click', () => pickShell());
    if (_isMobile) search.placeholder = 'Search';   // 16px font, ~130px wide on a phone
    // "Show archived" is remembered per browser (storage may be unavailable)
    let showArch = false;
    try { showArch = localStorage.getItem('lib-show-archived') === '1'; } catch {}
    if (localStorage.getItem('stats-hidden') === 'true') document.getElementById('sysStats').classList.add('hidden');

    async function jpost(path, body) {
      const r = await fetch(path, {method: 'POST', credentials: 'same-origin',
        headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
      let d = null;
      try { d = await r.json(); } catch {}
      if (!r.ok) {
        const err = new Error((d && d.error) || ('HTTP ' + r.status));
        err.status = r.status;                 // the caller may act on a 409's reason
        err.data = d;
        throw err;
      }
      return d;
    }

    function byId(id) { return sessions.find(s => s.id === id); }

    /* One number per terminal: when the conversation in a terminal changes
       (Claude's consent relaunch, /clear, /resume) the terminal takes the new
       conversation's number. Its row then carries prev_id (the number it had),
       switched_at, and aliases — old numbers that were never a conversation of
       their own, so an old link (?open=, the task board) still finds it. */
    function byIdOrAlias(id) {
      return byId(id) || sessions.find(s => Array.isArray(s.aliases) && s.aliases.includes(id));
    }
    // the latest row that took over from terminal `id`, or null
    function switchedFrom(id) {
      let best = null;
      for (const s of sessions) {
        if (s.prev_id === id && typeof s.switched_at === 'number' && s.id !== id
            && (!best || s.switched_at > best.switched_at)) best = s;
      }
      return best;
    }
    // switched_at of the last switch away from the open terminal already seen:
    // a switch newer than that is followed; opening an earlier row on purpose
    // (a /clear leaves the old conversation in the list) does not jump back
    let _selSwitchSeen = 0;

    function norm(q) { return (q || '').trim().toLocaleLowerCase(); }

    // same rule as library.search: name substring (any case) or code prefix
    function matches(s, q) {
      return !q || s.name.toLocaleLowerCase().includes(q) || s.id.startsWith(q);
    }

    // Archived topics are listed when "Show archived" is on, and also whenever
    // the search box is non-empty (search covers the archive). The poll always
    // fetches them (?archived=1), so both switch instantly from the last fetch.
    function wantArch() { return showArch || !!norm(search.value); }

    // Same rule as library.display_order: the manual order (pos) first, then
    // entries from before that rule newest-created first. Never by activity —
    // the list must not jump when a topic is opened, loaded or unloaded.
    function hasPos(s) { return typeof s.pos === 'number' && isFinite(s.pos); }
    function byOrder(a, b) {
      return (hasPos(b) - hasPos(a))
          || (hasPos(a) ? a.pos - b.pos : (b.created || 0) - (a.created || 0));
    }

    function ordered() {
      const q = norm(search.value);
      const arch = wantArch();
      return sessions
        .map((s, i) => [s, i])
        .filter(([s]) => (arch || !s.archived) && matches(s, q))
        .sort((a, b) => (!!a[0].archived - !!b[0].archived)     // archived last
                     || byOrder(a[0], b[0])
                     || (a[1] - b[1]))
        .map(([s]) => s);
    }

    function makeRow(id) {
      const c = document.createElement('div');
      c.className = 'card';
      c.dataset.sid = id;
      c.innerHTML = `
        <div class="card-top">
          <div class="proj"></div>
          <div class="card-btns">
            <button type="button" class="card-btn restart" title="Restart Claude in this terminal (same conversation)" aria-label="Restart Claude in this terminal">⟳</button>
            <button type="button" class="card-btn edit" title="Rename">✎</button>
            <span class="dot off"></span>
          </div>
        </div>
        <div class="card-row2">
          <span class="sid" title="Show this terminal's tasks"></span>
          <button type="button" class="mv-btn up" title="Move up" aria-label="Move up">▲</button>
          <button type="button" class="mv-btn down" title="Move down" aria-label="Move down">▼</button>
          <button type="button" class="arch-btn">Archive</button>
          <button type="button" class="trash-btn" title="Move to Trash" aria-label="Move to Trash"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5h11M6 4.5V2.8h4v1.7M4 4.5l.8 9h6.4l.8-9M6.8 7v4M9.2 7v4"/></svg></button>
        </div>`;
      c.querySelector('.sid').textContent = id;
      c.addEventListener('click', e => {
        if (e.target.closest('.card-btn, .arch-btn, .trash-btn, .mv-btn, input')) return;
        if (Date.now() - _dragEndedAt < 300) return;     // the end of a drag is not a click
        if (e.target.closest('.sid')) { openTasks(id); return; }   // code → its tasks (archived too)
        const s = byId(id);
        if (s && s.archived) { restoreAndOpen(id); return; }   // one click: restore + open
        pick(id);
      });
      c.querySelector('.card-btn.edit').addEventListener('click', e => {
        e.stopPropagation();
        startEdit(id);
      });
      c._restartBtn = c.querySelector('.card-btn.restart');   // in the row only while loaded (fill)
      c._restartBtn.addEventListener('click', e => {
        e.stopPropagation();
        restart(id);
      });
      c.querySelector('.arch-btn').addEventListener('click', e => {
        e.stopPropagation();
        archive(id, true);                    // one click; archived rows have no button
      });
      c.querySelector('.mv-btn.up').addEventListener('click', e => { e.stopPropagation(); step(id, -1); });
      c.querySelector('.mv-btn.down').addEventListener('click', e => { e.stopPropagation(); step(id, +1); });
      c.draggable = true;
      c.addEventListener('dragstart', e => {
        if (editing) { e.preventDefault(); return; }
        _dragId = id;
        c.classList.add('dragging');
        try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', id); } catch {}
      });
      c.addEventListener('dragover', e => {
        if (!_dragId || _dragId === id) return;
        e.preventDefault();
        const after = dropAfter(c, e);
        c.classList.toggle('drop-before', !after);
        c.classList.toggle('drop-after', after);
      });
      c.addEventListener('dragleave', () => c.classList.remove('drop-before', 'drop-after'));
      c.addEventListener('drop', e => {
        e.preventDefault();
        c.classList.remove('drop-before', 'drop-after');
        const from = _dragId;
        if (!from || from === id) return;
        const order = ordered().map(s => s.id).filter(x => x !== from);
        const at = order.indexOf(id);
        if (at < 0) return;
        order.splice(dropAfter(c, e) ? at + 1 : at, 0, from);
        applyOrder(order);
      });
      c.addEventListener('dragend', () => {
        c.classList.remove('dragging');
        _dragId = null;
        _dragEndedAt = Date.now();
        for (const el of rows.values()) el.classList.remove('drop-before', 'drop-after');
      });
      c.querySelector('.trash-btn').addEventListener('click', e => {
        e.stopPropagation();
        moveToTrash(id);                      // one question, then the server unloads it
      });
      rows.set(id, c);
      return c;
    }

    function fill(c, s, firstOff, firstArch) {
      c.classList.toggle('sel', s.id === sel);
      c.draggable = true;
      c.classList.toggle('unloaded', !s.active);
      c.classList.toggle('archived', !!s.archived);
      c.classList.toggle('first-off', firstOff);
      c.classList.toggle('first-arch', firstArch);
      const ab = c.querySelector('.arch-btn');
      // archived rows: no Archive (🗑 takes its place); a click on the row restores it
      ab.hidden = !!s.archived;
      ab.title = 'Archive and unload this terminal (the conversation stays on disk)';
      // ⟳ only on a loaded terminal of our own (not one still in an old numbered
      // terminal); taken out of the row otherwise, not just hidden. "In the row" is
      // rb.parentNode, not isConnected: a new row is filled before it is in the list
      const rb = c._restartBtn;
      if (s.active && !s.archived && typeof s.legacy_path !== 'string') {
        if (!rb.parentNode) c.querySelector('.card-btn.edit').before(rb);
      } else if (rb.parentNode) rb.remove();
      setBtnBusy(rb, _restarting.has(s.id));
      setBtnBusy(c.querySelector('.trash-btn'), _trashing.has(s.id));
      const pe = c.querySelector('.proj');
      if (!pe.querySelector('input')) pe.textContent = s.name;
      pe.title = s.name;
      const st = !s.active ? 'off' : s.status === 'working' ? 'working' : 'idle';
      const dot = c.querySelector('.dot');
      dot.className = 'dot ' + st;
      dot.title = s.archived ? 'archived — click to restore and open'
                : st === 'off' ? 'unloaded — click to load'
                : st === 'working' ? 'loaded, working' : 'loaded, idle';
    }

    function shellShown() {
      if (!shellState || !shellState.active) return false;
      const q = norm(search.value);
      return !q || 'command line cmd shell bash'.includes(q);
    }

    function fillShell() {
      shellRow.classList.toggle('sel', sel === SHELL);
      const st = shellState && shellState.status === 'working' ? 'working' : 'idle';
      const dot = shellRow.querySelector('.dot');
      dot.className = 'dot ' + st;
      dot.title = st === 'working' ? 'loaded, working' : 'loaded, idle';
    }

    function tasksShown() {
      if (!tasksOpen) return false;
      const q = norm(search.value);
      return !q || 'tasks task board'.includes(q);
    }

    function serverShown() {
      if (!serverOpen) return false;
      const q = norm(search.value);
      return !q || 'server status'.includes(q);
    }

    function render() {
      if (editing) return;                    // never pull the input out from under the user
      // pinned rows, in this order, above the terminals: Tasks, Server, Command line
      const showTasks = tasksShown();
      const showServer = serverShown();
      const showShell = shellShown();
      tasksRow.classList.toggle('sel', sel === TASKS);
      serverRow.classList.toggle('sel', sel === SERVER);
      if (showShell) fillShell();
      let pin = null;
      for (const [el, on] of [[tasksRow, showTasks], [serverRow, showServer], [shellRow, showShell]]) {
        if (!on) { if (el.parentNode) el.remove(); continue; }
        const ref = pin ? pin.nextSibling : list.firstChild;
        if (el !== ref) list.insertBefore(el, ref);
        pin = el;
      }
      const want = ordered();
      const keep = new Set(want.map(s => s.id));
      for (const [id, el] of rows) if (!keep.has(id)) { el.remove(); rows.delete(id); }
      const anyOn = want.some(s => s.active && !s.archived);
      const anyLive = want.some(s => !s.archived);
      let prev = pin, seenOff = false, seenArch = false;
      for (const s of want) {
        const c = rows.get(s.id) || makeRow(s.id);
        fill(c, s, anyOn && !s.active && !s.archived && !seenOff,
             anyLive && !!s.archived && !seenArch);
        if (!s.active && !s.archived) seenOff = true;
        if (s.archived) seenArch = true;
        const ref = prev ? prev.nextSibling : list.firstChild;
        if (c !== ref) list.insertBefore(c, ref);
        prev = c;
      }
      libEmpty.hidden = want.length > 0;
      libEmpty.textContent = norm(search.value) ? 'No matches'
                                                : 'No terminals yet — click “＋ New terminal”';
      archToggle.textContent = showArch ? 'Hide archived' : 'Show archived';
      archToggle.classList.toggle('on', showArch);
      // always at the bottom: the toggles, then the trash view
      if (list.lastChild !== trashView || trashView.previousSibling !== listFoot) {
        list.appendChild(listFoot);
        list.appendChild(trashView);
      }
    }

    archToggle.addEventListener('click', () => {
      showArch = !showArch;
      try { localStorage.setItem('lib-show-archived', showArch ? '1' : '0'); } catch {}
      mutSeq++;                                // a poll in flight has the other view
      render();
      poll();
    });

    function syncSel() {
      for (const [i, el] of rows) el.classList.toggle('sel', i === sel);
      shellRow.classList.toggle('sel', sel === SHELL);
      tasksRow.classList.toggle('sel', sel === TASKS);
      serverRow.classList.toggle('sel', sel === SERVER);
      if (sel === TASKS) {
        document.getElementById('tInfo').innerHTML = '<b>Task board</b>';
      } else if (sel === SERVER) {
        document.getElementById('tInfo').innerHTML = '<b>Server status</b>';
      } else if (sel === SHELL) syncTop(Object.assign({id: SHELL, name: 'Command line'}, shellState || {}));
      else if (sel) syncTop(byId(sel) || {id: sel, name: ''});
    }

    let _searching = false;
    search.addEventListener('input', () => {
      render();                               // instant, from the last poll
      const now = !!norm(search.value);
      if (now && !_searching) poll();         // then refresh the archive in the background
      _searching = now;
    });
    search.addEventListener('keydown', e => {
      if (e.key === 'Enter') {                 // Enter = open the top match
        e.preventDefault();
        const first = ordered().find(s => !s.archived);
        if (first) pick(first.id);
      } else if (e.key === 'Escape') {
        search.value = ''; _searching = false; render();
      }
    });

    /* ── ＋ New topic: ask for a name inline, create, open ── */
    let _creating = false;
    function openNewForm() {
      libTools.classList.add('creating');
      newForm.hidden = false;
      newName.value = '';
      newName.focus();
    }
    function closeNewForm() {
      libTools.classList.remove('creating');
      newForm.hidden = true;
    }
    newBtn.addEventListener('click', openNewForm);
    document.getElementById('newCancel').addEventListener('click', closeNewForm);
    newName.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.preventDefault(); closeNewForm(); }
    });
    newForm.addEventListener('submit', async e => {
      e.preventDefault();
      if (_creating) return;
      _creating = true; newOk.disabled = true;
      const name = newName.value.trim();       // empty → the server names it «Terminal DD.MM HH:MM»
      try {
        const d = await jpost('/api/library/new', {name});
        const s = d && (d.session || d);
        if (!s || !ID_RE.test(s.id)) throw new Error('the server returned no terminal code');
        mutSeq++;
        if (!byId(s.id)) sessions.push(Object.assign({}, s, {name: String(s.name ?? name)}));
        closeNewForm();
        search.value = ''; _searching = false;
        render();
        pick(s.id);
        setTimeout(poll, 1500);                // pick up "loaded" once ttyd has started it
      } catch (err) {
        _toast('⚠️ New terminal: ' + String(err && err.message || err).slice(0, 80), 5000);
      } finally {
        _creating = false; newOk.disabled = false;
      }
    });

    /* ── ✎ rename (inline, like the old project-name editor) ── */
    function startEdit(id) {
      const c = rows.get(id);
      if (!c) return;
      const pe = c.querySelector('.proj');
      if (pe.querySelector('input')) return;
      const s = byId(id);
      const cur = s ? s.name : pe.textContent;
      const inp = document.createElement('input');
      inp.className = 'proj-edit';
      inp.value = cur;
      inp.maxLength = 200;
      inp.placeholder = 'Terminal name';
      pe.textContent = '';
      pe.appendChild(inp);
      c.draggable = false;                     // let the mouse select text in the input
      editing = id;
      inp.focus();
      inp.select();

      let done = false;
      function finish(save) {
        if (done) return;
        done = true;
        editing = null;
        const val = inp.value.trim();
        const changed = save && val && val !== cur;
        pe.textContent = changed ? val : cur;  // also drops the input
        if (changed) {
          mutSeq++;
          if (s) s.name = val;
          jpost('/api/library/rename', {id, name: val}).catch(err => {
            if (s && s.name === val) s.name = cur;
            render(); syncSel();
            _toast('⚠️ Not renamed: ' + String(err && err.message || err).slice(0, 60), 5000);
          });
          if (id === sel) syncSel();
        }
        render();
      }
      inp.addEventListener('keydown', e => {
        e.stopPropagation();
        if (e.key === 'Enter') { e.preventDefault(); finish(true); }
        else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
      });
      inp.addEventListener('blur', () => finish(true));
      inp.addEventListener('click', e => e.stopPropagation());
    }

    /* ── Archive / Restore: one click. Archive also unloads the terminal (the
       server keeps a working one loaded until it finishes and says so); if it
       is the one in the viewer, the viewer goes back to the placeholder.
       Archived topics stay reachable via "Show archived" and search; a click
       on an archived row restores it and opens it. No confirm step. ── */
    async function archive(id, archived) {
      const s = byId(id);
      const was = s ? !!s.archived : !archived;
      if (s) s.archived = archived;
      if (archived && sel === id) showPlaceholder();
      mutSeq++;
      render();
      try {
        const d = await jpost('/api/library/archive', {id, archived});
        const nm = (s ? s.name : id).slice(0, 40);
        if (s && d && typeof d.active === 'boolean') {
          s.active = d.active;
          if (typeof d.status === 'string') s.status = d.status;
          render();
        }
        _toast(!archived ? 'Restored “' + nm + '”'
               : d && d.unloaded ? 'Archived and unloaded “' + nm + '”'
               : d && d.unload_pending ? "Archived — it's busy, it will unload when it finishes"
               : 'Archived “' + nm + '” — the conversation is kept', 3000);
        return true;
      } catch (err) {
        if (s) s.archived = was;
        render();
        _toast('⚠️ ' + (archived ? 'Not archived: ' : 'Not restored: ')
               + String(err && err.message || err).slice(0, 60), 5000);
        return false;
      }
    }

    /* ── ⟳ Restart (loaded rows): Claude starts again in the same conversation,
       so new launch settings take effect and a hung Claude comes back. ONE
       question (owner: two in a row was awkward): ask the server first whether
       it is busy (check:true), then a plain "Restart?" for an idle terminal or a
       red one with "!" naming what it is doing, which sends force:true. Only if
       it turned busy after the plain question does the server's 409 bring the
       red one up. If it is the terminal in the viewer, its frame is opened again
       so the tab attaches cleanly. ── */
    // lib_busy_reason's reasons in words; the red title says what the terminal is
    // doing, not always "working"
    const BUSY_WORDS = {printing: 'it is printing right now', hold: 'a timer is pending',
                        'background-task': 'a background task is running',
                        working: 'it is working'};
    const BUSY_TITLE = {printing: 'is working right now', working: 'is working right now',
                        hold: 'is waiting on a timer',
                        'background-task': 'has a background task running'};
    // one at a time (⟳, 🗑, Empty trash): a 2nd question must not replace the 1st, and
    // nothing new starts while one is still running on the server. The refusal says
    // which: a question on screen, or what is still running.
    let _busyWith = null;            // null | 'restart' | 'trash' | 'empty'
    const BUSY_WAIT = {restart: 'Wait for the restart to finish',
                       trash: 'Wait for Move to Trash to finish',
                       empty: 'Wait for the trash to be emptied'};
    function oneAtATime() {
      if (!_busyWith) return false;
      const d = document.getElementById('confirmDlg');
      _toast(d && d.open ? 'One question at a time' : BUSY_WAIT[_busyWith], 2500);
      return true;
    }
    function setBtnBusy(b, on) {
      if (!b) return;
      b.classList.toggle('busy', on);
      b.setAttribute('aria-busy', on ? 'true' : 'false');
    }
    // the page's own question (not confirm(): it can't look different when it matters).
    // q = {title, text, ok, danger}: danger = red with "!", and Cancel has the focus,
    // so Enter never interrupts work or erases anything
    function ask(q) {
      const d = document.getElementById('confirmDlg');
      const ok = d.querySelector('.dlg-ok'), no = d.querySelector('.dlg-cancel');
      d.classList.toggle('danger', !!q.danger);
      d.setAttribute('role', q.danger ? 'alertdialog' : 'dialog');
      d.querySelector('#confirmDlgTitle').textContent = q.title;
      d.querySelector('#confirmDlgText').textContent = q.text;
      ok.textContent = q.ok;
      return new Promise(resolve => {
        const done = yes => {
          ok.removeEventListener('click', onOk);
          no.removeEventListener('click', onNo);
          d.removeEventListener('cancel', onEsc);
          if (d.open) d.close();
          resolve(yes);
        };
        const onOk = () => done(true), onNo = () => done(false);
        const onEsc = e => { e.preventDefault(); done(false); };
        ok.addEventListener('click', onOk);
        no.addEventListener('click', onNo);
        d.addEventListener('cancel', onEsc);
        d.showModal();
        (q.danger ? no : ok).focus();
      });
    }
    function askRestart(nm, reason) {
      return ask(reason
        ? {danger: true, title: '“' + nm + '” ' + (BUSY_TITLE[reason] || 'is busy right now'),
           text: 'Restarting now will interrupt it (' + (BUSY_WORDS[reason] || 'it is busy')
                 + '). Claude starts again in the same conversation.',
           ok: 'Restart anyway'}
        : {title: 'Restart “' + nm + '”?', text: 'Claude starts again in the same conversation.',
           ok: 'Restart'});
    }
    async function restart(id) {
      if (_restarting.has(id)) return;         // busy: a double click is one restart
      if (oneAtATime()) return;
      const s = byId(id);
      const nm = s ? s.name : id;
      _restarting.add(id);
      _busyWith = 'restart';
      setBtnBusy(rows.get(id) && rows.get(id)._restartBtn, true);
      try {
        const c = await jpost('/api/library/restart-check', {id});
        const reason = (c && c.busy) || null;
        if (!await askRestart(nm, reason)) return;
        let d;
        try {
          d = await jpost('/api/library/restart', reason ? {id, force: true} : {id});
        } catch (err) {
          const why = !reason && err && err.status === 409 && err.data && BUSY_WORDS[err.data.reason];
          if (!why) throw err;
          if (!await askRestart(nm, err.data.reason)) return;   // turned busy since we asked
          d = await jpost('/api/library/restart', {id, force: true});
        }
        const nid = d && ID_RE.test(d.id || '') ? d.id : id;
        if (s && d && typeof d.active === 'boolean') {
          s.active = d.active;
          if (typeof d.status === 'string') s.status = d.status;
        }
        mutSeq++;
        if (sel === id || sel === nid) pick(nid);   // a fresh frame attaches to the new Claude
        render();
        _toast('Restarted “' + nm.slice(0, 40) + '”', 3000);
        poll();
      } catch (err) {
        _toast('⚠️ Not restarted: ' + String(err && err.message || err).slice(0, 60), 5000);
      } finally {
        _restarting.delete(id);
        _busyWith = null;
        setBtnBusy(rows.get(id) && rows.get(id)._restartBtn, false);
      }
    }

    // an archived row / board link: restore (same API as before), then open it
    // like a normal row — the terminal endpoint refuses archived ids, so only
    // after the server has said yes
    const _restoring = new Set();
    async function restoreAndOpen(id) {
      if (_restoring.has(id)) return;          // a double click is one restore
      _restoring.add(id);
      try {
        if (await archive(id, false)) pick(id);
      } finally {
        _restoring.delete(id);
      }
    }

    /* ── Manual order: drag a row (desktop) or ▲▼ (touch). Optimistic: the
       list moves at once, POST /api/library/reorder with the full visible
       order; on error the old order comes back with a toast. ── */
    let _dragId = null, _dragEndedAt = 0;
    try { if (navigator.maxTouchPoints > 0 || 'ontouchstart' in window)
            document.documentElement.classList.add('touch'); } catch {}

    function dropAfter(c, e) {
      const r = c.getBoundingClientRect();
      return e.clientY > r.top + r.height / 2;
    }

    function step(id, d) {
      const order = ordered().map(s => s.id);
      const i = order.indexOf(id), j = i + d;
      if (i < 0 || j < 0 || j >= order.length) return;
      [order[i], order[j]] = [order[j], order[i]];
      applyOrder(order);
    }

    async function applyOrder(ids) {
      const was = new Map(sessions.map(s => [s.id, s.pos]));
      ids.forEach((id, i) => { const s = byId(id); if (s) s.pos = i; });
      mutSeq++;
      render();
      try {
        await jpost('/api/library/reorder', {ids});
      } catch (err) {
        for (const s of sessions) { if (was.has(s.id)) s.pos = was.get(s.id); }
        mutSeq++;
        render();
        _toast('⚠️ Not reordered: ' + String(err && err.message || err).slice(0, 60), 5000);
      }
    }

    /* ── 🗑 Trash (owner 2026-10-23). Archive = needed, just not now; Trash = not
       needed, kept just in case. 🗑 on every terminal row (the list and the
       archive) asks ONE question — plain, or red with "!" naming what a busy
       terminal is doing, which then forces it; the server unloads a loaded one.
       Trashed terminals are in no list: "Show trash" lists them, each with
       Restore (back where it was — an archived one stays archived). Nothing is
       erased by itself: only "Empty trash", after a red question with the count,
       and only the ones this view showed. ── */
    function askTrash(s, nm, reason) {
      return ask(reason
        ? {danger: true, title: '“' + nm + '” ' + (BUSY_TITLE[reason] || 'is busy right now'),
           text: 'Moving it to the trash now will interrupt it (' + (BUSY_WORDS[reason] || 'it is busy')
                 + '). The terminal is unloaded; the conversation is kept in the trash.',
           ok: 'Move to Trash anyway'}
        : {title: 'Move “' + nm + '” to Trash?',
           text: (s && s.active ? 'The terminal is unloaded. ' : '')
                 + 'The conversation is kept in the trash until you empty it.',
           ok: 'Move to Trash'});
    }
    async function moveToTrash(id) {
      if (_trashing.has(id)) return;           // a double click is one question
      if (oneAtATime()) return;
      const s = byId(id);
      const nm = s ? s.name : id;
      _trashing.add(id);
      _busyWith = 'trash';
      setBtnBusy(rows.get(id) && rows.get(id).querySelector('.trash-btn'), true);   // pulses while it unloads
      try {
        const c = await jpost('/api/library/trash-check', {id});
        const reason = (c && c.busy) || null;
        if (!await askTrash(s, nm, reason)) return;
        try {
          await jpost('/api/library/trash', reason ? {id, force: true} : {id});
        } catch (err) {
          const why = !reason && err && err.status === 409 && err.data && BUSY_WORDS[err.data.reason];
          if (!why) throw err;
          if (!await askTrash(s, nm, err.data.reason)) return;   // turned busy since we asked
          await jpost('/api/library/trash', {id, force: true});
        }
        const i = sessions.findIndex(x => x.id === id);
        if (i >= 0) sessions.splice(i, 1);
        mutSeq++;
        if (sel === id) showPlaceholder();
        render();
        _toast('Moved “' + nm.slice(0, 40) + '” to Trash', 3000);
        if (showTrash) loadTrash();
      } catch (err) {
        _toast('⚠️ Not moved to Trash: ' + String(err && err.message || err).slice(0, 70), 5000);
      } finally {
        _trashing.delete(id);
        _busyWith = null;
        setBtnBusy(rows.get(id) && rows.get(id).querySelector('.trash-btn'), false);
      }
    }

    let showTrash = false;
    let trash = [];                  // last GET /api/library?trash=1, most recently trashed first
    let trashSeq = 0;                // bumped on every local change: a load that started before is stale
    let trashLoaded = false, trashKey = null;
    let trashFailed = false;         // the last load failed and nothing was ever loaded
    const trashList = document.getElementById('trashList');
    const trashEmpty = document.getElementById('trashEmpty');
    const emptyBtn = document.getElementById('emptyTrash');
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    function trashedAt(t) {
      const d = new Date(t * 1000), two = n => String(n).padStart(2, '0');
      return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + two(d.getHours()) + ':' + two(d.getMinutes());
    }
    // loud: the owner just opened the view, so a failure is also a toast (the poll's
    // retries only keep the inline line). A failure never reads as "the trash is empty".
    async function loadTrash(loud) {
      const seq = trashSeq;
      let why = null;
      try {
        const r = await fetch('/api/library?trash=1', {cache: 'no-store', credentials: 'same-origin'});
        const d = r.ok ? await r.json() : null;
        if (seq !== trashSeq) return;
        if (!d || !Array.isArray(d.sessions)) {
          why = r.ok ? 'a bad answer' : r.status === 401 ? 'signed out' : 'error ' + r.status;
        } else {
          trash = d.sessions
            .filter(s => s && ID_RE.test(s.id) && typeof s.trashed === 'number')
            .map(s => Object.assign({}, s, {name: String(s.name ?? '')}));
          trashLoaded = true;
          trashFailed = false;
        }
      } catch (err) {
        if (seq !== trashSeq) return;
        why = 'no connection';
      }
      if (why && !trashLoaded) {
        trashFailed = true;
        if (loud && showTrash) _toast('⚠️ Could not load the trash (' + why + ')', 5000);
      }
      renderTrash();
    }
    function renderTrash() {
      trashView.hidden = !showTrash;
      trashToggle.textContent = showTrash ? 'Hide trash' : 'Show trash';
      trashToggle.classList.toggle('on', showTrash);
      if (!showTrash) return;
      document.getElementById('trashTitle').textContent = trash.length ? 'Trash · ' + trash.length : 'Trash';
      trashEmpty.textContent = trashFailed ? 'Could not load the trash — trying again' : 'The trash is empty';
      trashEmpty.classList.toggle('failed', trashFailed);
      trashEmpty.hidden = !(trashFailed || (trashLoaded && trash.length === 0));
      emptyBtn.hidden = trash.length === 0;
      // rebuilt only when it changed: a poll must not swap a button under the pointer
      const key = JSON.stringify(trash.map(s => [s.id, s.name, s.trashed, !!s.archived]));
      if (key === trashKey) return;
      trashKey = key;
      trashList.textContent = '';
      for (const s of trash) {
        const r = document.createElement('div');
        r.className = 'trash-row';
        r.dataset.tid = s.id;
        r.innerHTML = '<div class="trash-info"><div class="trash-name"></div><div class="when"></div></div>'
          + '<button type="button" class="restore-btn" title="Put it back where it was">Restore</button>';
        const n = r.querySelector('.trash-name');
        n.textContent = s.name;
        n.title = s.name;
        r.querySelector('.when').textContent = s.id + ' · trashed ' + trashedAt(s.trashed)
          + (s.archived ? ' · from the archive' : '');
        r.querySelector('.restore-btn').addEventListener('click', () => untrash(s.id));
        trashList.appendChild(r);
      }
    }
    // bring the opened view into the list's sight once its rows are in: on a phone the
    // list is a few rows tall, so the head goes to the top (the rows below it), never
    // only the bottom edge — that showed just half of the red Empty trash
    function revealTrash() {
      const l = document.getElementById('list').getBoundingClientRect();
      const v = trashView.getBoundingClientRect();
      if (v.top >= l.top && v.bottom <= l.bottom) return;    // already in full sight
      trashView.scrollIntoView({block: v.height > l.height ? 'start' : 'nearest'});
    }
    trashToggle.addEventListener('click', async () => {
      showTrash = !showTrash;
      renderTrash();
      if (!showTrash) return;
      revealTrash();                           // the head at once…
      await loadTrash(true);
      if (showTrash) revealTrash();            // …and again with the rows in
    });

    const _untrashing = new Set();
    async function untrash(id) {
      if (_untrashing.has(id)) return;         // a double click is one restore
      _untrashing.add(id);
      const t = trash.find(x => x.id === id);
      const nm = (t ? t.name : id).slice(0, 40);
      try {
        const d = await jpost('/api/library/untrash', {id});
        trashSeq++;
        trash = trash.filter(x => x.id !== id);
        renderTrash();
        if (d && ID_RE.test(d.id || '') && !byId(d.id)) {    // back in the list at once
          const row = Object.assign({}, d, {name: String(d.name ?? '')});
          delete row.trashed;
          sessions.push(row);
          mutSeq++;
          render();
        }
        _toast('Restored “' + nm + '”' + (d && d.archived ? ' to the archive' : ''), 3000);
        poll();
      } catch (err) {
        _toast('⚠️ Not restored: ' + String(err && err.message || err).slice(0, 60), 5000);
      } finally {
        _untrashing.delete(id);
      }
    }

    // why Empty trash kept one (the server's skipped[].reason)
    const KEPT_WHY = {running: 'still running', 'not-trashed': 'restored meanwhile',
                      unknown: 'already gone', corrupt: 'a broken entry', 'erase-failed': "couldn't erase it",
                      'left-on-disk': 'still on disk elsewhere'};
    async function emptyTrash() {
      if (oneAtATime()) return;
      const ids = trash.map(s => s.id);        // exactly what this view shows
      if (!ids.length) return;
      _busyWith = 'empty';
      try {
        const n = ids.length;
        if (!await ask({danger: true, title: 'Empty the trash?',
                        text: n + (n === 1 ? ' conversation will' : ' conversations will')
                              + ' be erased for good. This cannot be undone.',
                        ok: 'Erase for good'})) return;
        const d = await jpost('/api/library/empty-trash', {ids});
        const gone = new Set(Array.isArray(d && d.erased) ? d.erased : []);
        const kept = Array.isArray(d && d.skipped) ? d.skipped : [];
        trashSeq++;
        trash = trash.filter(s => !gone.has(s.id));
        renderTrash();
        const why = [...new Set(kept.map(k => KEPT_WHY[k && k.reason] || 'kept'))].join(', ');
        _toast('Erased ' + gone.size + (kept.length ? ' · ' + kept.length + ' kept: ' + why : ''), 5000);
        loadTrash();
      } catch (err) {
        _toast('⚠️ Trash not emptied: ' + String(err && err.message || err).slice(0, 60), 5000);
      } finally {
        _busyWith = null;
      }
    }
    emptyBtn.addEventListener('click', emptyTrash);

    let _frameFocus = null;
    document.addEventListener('click', e => {
      const wrap = document.getElementById('wrap');
      if (_frameFocus && wrap.contains(e.target)) _frameFocus();
    });

    function pick(id) {
      if (!ID_RE.test(id)) return;
      sel = id;
      const sw = switchedFrom(id);
      _selSwitchSeen = sw ? sw.switched_at : 0;
      document.getElementById('topbar').classList.remove('no-term');
      setLabel(id, true);
      syncSel();
      // a topic still running in an old numbered terminal opens there (the
      // server refuses a second Claude on the same conversation)
      const row = sessions.find(s => s.id === id);
      const legacy = row && typeof row.legacy_path === 'string' && /^\/terminal\d*\/$/.test(row.legacy_path) ? row.legacy_path : null;
      openFrame(legacy || ('/sess/?arg=' + id));
    }

    // cmd button / "Command line" row: the server starts the shell if needed
    // and every tab attaches to the same one
    let _shellSeenUp = false;  // the open shell frame's shell has been reported running

    // back to "Pick a terminal on the left" (the shell was closed or exited)
    function showPlaceholder() {
      sel = null;
      _shellSeenUp = false;
      const wrap = document.getElementById('wrap');
      const f = wrap.querySelector('iframe'); if (f) f.remove();
      if (!document.getElementById('ph')) {
        const ph = document.createElement('div');
        ph.className = 'ph'; ph.id = 'ph'; ph.textContent = 'Pick a terminal on the left';
        wrap.appendChild(ph);
      }
      document.getElementById('topbar').classList.add('no-term');
      _frameFocus = null;
      syncSel();
    }

    function pickShell() {
      sel = SHELL;
      _shellSeenUp = !!(shellState && shellState.active);
      document.getElementById('topbar').classList.remove('no-term');
      setLabel('cmd');
      syncSel();
      openFrame(SHELL_PATH);
      if (!(shellState && shellState.active)) setTimeout(poll, 1500);   // show its row
    }

    // session: a terminal's 8-hex id -> the board opens filtered to its tasks
    function openTasks(session) {
      tasksOpen = true;
      saveTasksOpen();
      sel = TASKS;
      document.getElementById('topbar').classList.remove('no-term');
      setLabel('tasks');
      render();
      syncSel();
      openFrame(ID_RE.test(session || '') ? TASKS_PATH + '?session=' + session : TASKS_PATH, true);
    }

    // top-bar label; a terminal's id there is a link to that terminal's tasks
    function setLabel(text, isTerminal) {
      const l = document.getElementById('tNum');
      l.textContent = text;
      l.classList.toggle('link', !!isTerminal);
      if (isTerminal) l.title = "Show this terminal's tasks"; else l.removeAttribute('title');
    }
    document.getElementById('tNum').addEventListener('click', () => {
      if (ID_RE.test(sel || '')) openTasks(sel);
    });

    // The task board (same origin, in our iframe or standalone via /?open=<id>)
    // asks to open a terminal by its code. Same rule as a list click: a known
    // terminal opens even if the search hides its row; an archived one is
    // restored first.
    function openTerminalById(id) {
      if (!ID_RE.test(id || '')) return;
      const s = byIdOrAlias(id);
      if (!s) { _toast('Terminal ' + id + ' not found', 3000); return; }
      if (s.archived) { restoreAndOpen(s.id); return; }
      pick(s.id);
    }
    window.addEventListener('message', e => {
      if (e.origin !== location.origin) return;
      const d = e.data;
      // 'agentdeck:open-terminal': the same message from a board page before v2.1.0
