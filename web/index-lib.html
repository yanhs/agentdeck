      if (!d || typeof d !== 'object' || (d.type !== 'agentkennel:open-terminal' && d.type !== 'agentdeck:open-terminal')) return;
      if (typeof d.id !== 'string' || !ID_RE.test(d.id)) return;
      openTerminalById(d.id);
    });
    // ?open=<id>: honoured once the first list arrives, then dropped from the URL
    let _pendingOpen = null;
    try {
      const u = new URL(location.href);
      if (u.searchParams.has('open')) {
        const v = u.searchParams.get('open') || '';
        if (ID_RE.test(v)) _pendingOpen = v;
        u.searchParams.delete('open');
        history.replaceState(history.state, '', u.pathname + (u.search === '?' ? '' : u.search) + u.hash);
      }
    } catch {}

    function closeTasks() {
      tasksOpen = false;
      saveTasksOpen();
      if (sel === TASKS) showPlaceholder();
      render();
    }

    document.getElementById('tasksBtn').addEventListener('click', e => {
      if (e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return;   // new tab/window: browser default
      e.preventDefault();
      openTasks();
    });
    tasksRow.addEventListener('click', e => {
      if (e.target.closest('.tasks-close')) return;
      openTasks();
    });
    tasksRow.querySelector('.tasks-close').addEventListener('click', e => {
      e.stopPropagation();
      closeTasks();
    });

    function openServer() {
      serverOpen = true;
      saveServerOpen();
      sel = SERVER;
      document.getElementById('topbar').classList.remove('no-term');
      setLabel('server');
      render();
      syncSel();
      openFrame(SERVER_PATH, true);
    }

    function closeServer() {
      serverOpen = false;
      saveServerOpen();
      if (sel === SERVER) showPlaceholder();
      render();
    }

    document.getElementById('serverBtn').addEventListener('click', e => {
      if (e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return;   // new tab/window: browser default
      e.preventDefault();
      openServer();
    });
    serverRow.addEventListener('click', e => {
      if (e.target.closest('.server-close')) return;
      openServer();
    });
    serverRow.querySelector('.server-close').addEventListener('click', e => {
      e.stopPropagation();
      closeServer();
    });

    /* ── "Copied" chip: after a mouse selection in a terminal was actually copied
       to the clipboard (enableClipboardCopy), a small chip in the terminal's
       top-right corner confirms it and says how to paste. The paste shortcut is
       spelled out for the first HINT_MAX copies in this browser (count in
       localStorage; broken storage = keep spelling it out), then just "Copied". ── */
    const HINT_KEY = 'agentkennel-copy-hint', HINT_MAX = 5, HINT_MS = 1500;
    const HINT_KEY_OLD = 'agentdeck-copy-hint';   // the count before v2.1.0, still read
    const _isMac = (() => {
      const n = navigator;
      return /mac|iphone|ipad/i.test([n.userAgentData && n.userAgentData.platform,
                                      n.platform, n.userAgent].join(' '));
    })();
    let _hintTimer = null;
    function hideCopyHint() {
      clearTimeout(_hintTimer); _hintTimer = null;
      const h = document.getElementById('copyHint'); if (h) h.classList.remove('show');
    }
    function showCopyHint() {
      let n = 0;
      try { n = parseInt(localStorage.getItem(HINT_KEY) || localStorage.getItem(HINT_KEY_OLD), 10) || 0; } catch (e) {}
      if (n < HINT_MAX) { try { localStorage.setItem(HINT_KEY, String(n + 1)); } catch (e) {} }
      const wrap = document.getElementById('wrap');
      let h = document.getElementById('copyHint');
      if (!h) {
        h = document.createElement('div');
        h.id = 'copyHint'; h.className = 'copy-hint';
        h.setAttribute('role', 'status'); h.setAttribute('aria-live', 'polite');
      }
      if (h.parentNode !== wrap) wrap.appendChild(h);
      h.textContent = n < HINT_MAX
        ? 'Copied · ' + (_isMac ? '⌘V' : 'Ctrl+Shift+V') + ' to paste' : 'Copied';
      h.classList.remove('show');
      void h.offsetWidth;                      // restart the fade-in on a quick re-copy
      h.classList.add('show');
      clearTimeout(_hintTimer);
      _hintTimer = setTimeout(hideCopyHint, HINT_MS);
    }

    // plain = a web page (the task board), not a terminal: no ttyd helpers
    function openFrame(path, plain) {
      document.getElementById('tOpen').href = path;
      const wrap = document.getElementById('wrap');
      const ph = document.getElementById('ph'); if (ph) ph.remove();
      const old = wrap.querySelector('iframe'); if (old) old.remove();
      _tmuxSel = null;                                // a selection belongs to the old terminal
      const f = document.createElement('iframe'); f.src = path;
      wrap.appendChild(f);
      hideCopyHint();
      if (plain) { _frameFocus = null; return; }
      if (_isMobile) enableIframeTouchScroll(f);
      onXtermScreen(f, attachWheelThrottle);       // touchpads: desktop and tablet alike
      if (!_isMobile) enableClipboardCopy(f);
      enablePasteImage(f);
      suppressContextMenu(f);
      const doFocus = () => { try { f.focus(); f.contentWindow?.focus(); } catch(e) {} };
      f.addEventListener('load', doFocus);
      f.addEventListener('mousedown', doFocus);
      _frameFocus = doFocus;
    }

    /* ── Mobile input bar ── */
    function sendToTerminal(text) {
      try {
        const f = document.querySelector('#wrap iframe');
        if (!f) return;
        const term = f.contentWindow.term;
        if (!term) return;
        if (typeof term.input === 'function') { term.input(text); return; }
        try { term._core.coreService.triggerDataEvent(text); return; } catch(e) {}
        try { term._core._onData.fire(text); return; } catch(e) {}
      } catch(e) {}
    }

    const mobText = document.getElementById('mobText');
    document.getElementById('mobSend').addEventListener('click', () => {
      const text = mobText.value;
      sendToTerminal(text ? text + '\r' : '\r');
      mobText.value = '';
      mobText.focus();
    });
    mobText.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('mobSend').click(); }
    });
    document.getElementById('mobEsc').addEventListener('click', () => {
      sendToTerminal('\x03');
      mobText.value = '';
      mobText.focus();
    });
    /* ── Tab + cursor arrows: send the key's bytes. preventDefault stops the click
       from stealing focus from the iframe, so repeated taps keep working. ── */
    const ARROW_KEYS = {
      mobTab:   '\t',
      mobLeft:  '\x1b[D',
      mobRight: '\x1b[C',
      mobUp:    '\x1b[A',
      mobDown:  '\x1b[B',
    };
    for (const [id, seq] of Object.entries(ARROW_KEYS)) {
      const btn = document.getElementById(id);
      if (!btn) continue;
      btn.addEventListener('mousedown', e => e.preventDefault());
      btn.addEventListener('click', e => {
        e.preventDefault();
        sendToTerminal(seq);
      });
    }

    /* ── Esc button: send Escape key to terminal iframe ── */
    document.getElementById('tEsc').addEventListener('click', () => {
      try {
        const f = document.querySelector('#wrap iframe');
        if (!f) return;
        const win = f.contentWindow;
        const term = win.term;
        if (term) {
          if (typeof term.input === 'function') { term.input('\x1b'); return; }
          try { term._core.coreService.triggerDataEvent('\x1b'); return; } catch(e) {}
          try { term._core._onData.fire('\x1b'); return; } catch(e) {}
        }
        const doc = f.contentDocument || win.document;
        const el = doc.querySelector('.xterm-helper-textarea') || doc.activeElement || doc.body;
        el.dispatchEvent(new KeyboardEvent('keydown', {key:'Escape',code:'Escape',keyCode:27,which:27,bubbles:true}));
      } catch(e) {}
    });

    /* ── ⋯ account menu: opens on click/Enter/Space, closes on outside click,
       Esc (focus back to ⋯), Tab out of it, or when focus goes into the terminal. ── */
    (function accountMenu() {
      const btn = document.getElementById('tMenu');
      const menu = document.getElementById('tMenuList');
      const items = () => [...menu.querySelectorAll('[role=menuitem]')];
      const isOpen = () => !menu.hidden;
      function open(focusFirst) {
        menu.hidden = false;
        btn.setAttribute('aria-expanded', 'true');
        if (focusFirst) items()[0].focus();
      }
      function close(refocus) {
        if (!isOpen()) return;
        menu.hidden = true;
        btn.setAttribute('aria-expanded', 'false');
        if (refocus) btn.focus();
      }
      btn.addEventListener('click', e => {
        e.stopPropagation();
        if (isOpen()) close(false);
        else open(e.detail === 0);            // keyboard "click" (Enter/Space) → focus first item
      });
      btn.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown') { e.preventDefault(); open(true); }
      });
      menu.addEventListener('keydown', e => {
        const list = items(), i = list.indexOf(document.activeElement);
        if (e.key === 'Escape') { e.preventDefault(); close(true); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); list[(i + 1) % list.length].focus(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); list[(i - 1 + list.length) % list.length].focus(); }
        else if (e.key === 'Home') { e.preventDefault(); list[0].focus(); }
        else if (e.key === 'End') { e.preventDefault(); list[list.length - 1].focus(); }
      });
      document.getElementById('tAcct').addEventListener('focusout', e => {
        if (!e.relatedTarget || !document.getElementById('tAcct').contains(e.relatedTarget)) close(false);
      });
      document.addEventListener('click', e => {
        if (isOpen() && !document.getElementById('tAcct').contains(e.target)) close(false);
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && isOpen()) close(true);
      });
      window.addEventListener('blur', () => close(false));   // focus went into the terminal iframe
    })();

    /* ── Dark / Light theme (⋯ menu). Stored in localStorage 'agentkennel-theme'
       (same origin as the Tasks and Server pages, which follow it live through
       the storage event); the <head> script applies it before first paint. ── */
    (function themeSwitch() {
      const KEY = 'agentkennel-theme', OLD_KEY = 'agentdeck-theme';   // OLD_KEY: before v2.1.0
      const item = document.getElementById('tTheme');
      const current = () => document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
      function apply(t) {
        document.documentElement.dataset.theme = t;
        item.textContent = t === 'light' ? 'Dark theme' : 'Light theme';
      }
      apply(current());
      item.addEventListener('click', e => {
        e.stopPropagation();
        const t = current() === 'light' ? 'dark' : 'light';
        apply(t);
        try { localStorage.setItem(KEY, t); } catch (err) {}
      });
      window.addEventListener('storage', e => {          // switched in another tab
        if (e.key === KEY || e.key === OLD_KEY) apply(e.newValue === 'light' ? 'light' : 'dark');
      });
    })();

    /* ── 📎 Image: the reliable path — read the clipboard image directly on a
       button click (no fragile paste-event interception inside the ttyd iframe). ── */
    // 📎 File: pick files → upload → their paths into the terminal (a clipboard image
    // still pastes with Ctrl+V / ⌘V, and files can be dropped onto the terminal)
    const _fileInput = document.getElementById('tFileInput');
    document.getElementById('tPasteImg').addEventListener('click', () => _fileInput.click());
    _fileInput.addEventListener('change', () => {
      const files = Array.from(_fileInput.files || []);
      _fileInput.value = '';                          // the same file again fires change again
      _uploadFiles(files);
    });

    /* ── Mobile: touch → xterm.js's own selection + vertical scroll ──
       Claude's fullscreen renderer tracks the mouse, so tmux hands it every mouse event
       (a fake mousedown on each touchstart made a tap Claude's double click).
       - a tap sends nothing synthetic: the browser's own click is one press + release;
       - a long press (LONG_MS within SLOP px), then a drag in any direction, sends mouse
         events xterm.js takes as "force selection" (Shift while the pane tracks the mouse;
         Alt + macOptionClickForcesSelection where xterm.js sees a Mac, as on iPadOS), so
         nothing reaches tmux; touchend copies term.getSelection() right there, inside the
         gesture, and shows the "Copied" chip; touchcancel never copies;
       - a move before the long press scrolls: wheel events at the finger, one per three
         cell heights; two fingers do nothing. ── */
    // fn(win, screen) once the terminal iframe's xterm.js screen exists
    function onXtermScreen(iframe, fn) {
      iframe.addEventListener('load', () => {
        let attempts = 0;
        const poll = setInterval(() => {
          if (++attempts > 50) { clearInterval(poll); return; }
          try {
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            const screen = doc.querySelector('.xterm-screen');
            if (!screen) return;
            clearInterval(poll);
            fn(iframe.contentWindow, screen);
          } catch(e) { clearInterval(poll); }
        }, 100);
      });
    }

    function enableIframeTouchScroll(iframe) {
      onXtermScreen(iframe, (win, screen) => attachTouchSelect(win, screen));
    }

    /* ── Touchpad: a calmer terminal scroll ──
       xterm.js sends the app (tmux, Claude) a wheel report for EVERY wheel event, and each
       report scrolls several lines (tmux copy mode: 5), so a touchpad's stream of small
       deltas flew past. Small pixel deltas are summed here and one report goes through per
       WHEEL_CELLS cell heights of travel, as a phone swipe does. A mouse-wheel notch is one
       big delta (>= NOTCH_PX) and stays one report. Ctrl+wheel (pinch zoom), line/page
       deltas and our own synthetic events pass untouched. ── */
    function attachWheelThrottle(win, screen) {
      const WHEEL_CELLS = 3, NOTCH_PX = 50;
      const cellH = () => {
        const rows = win.term && win.term.rows;
        return rows ? screen.getBoundingClientRect().height / rows : 20;
      };
      let accum = 0;
      // capture on the window: runs before xterm.js's own listener on .xterm
      win.addEventListener('wheel', e => {
        if (!e.isTrusted || e.ctrlKey || e.deltaMode !== 0 || !e.deltaY) return;
        if (!screen.contains(e.target)) return;
        e.preventDefault();
        e.stopPropagation();
        if (accum && Math.sign(accum) !== Math.sign(e.deltaY)) accum = 0;   // turned around
        accum += e.deltaY;
        if (Math.abs(e.deltaY) < NOTCH_PX && Math.abs(accum) < WHEEL_CELLS * cellH()) return;
        accum = 0;
        screen.dispatchEvent(new win.WheelEvent('wheel', {
          deltaY: e.deltaY > 0 ? 120 : -120, deltaMode: 0, bubbles: true, cancelable: true,
          clientX: e.clientX, clientY: e.clientY
        }));
      }, {capture: true, passive: false});
    }

    function attachTouchSelect(win, screen) {
      const doc = screen.ownerDocument;
      const LONG_MS = 450, SLOP = 8;
      // xterm.js's own Mac test (navigator.platform); iPadOS "desktop site" says MacIntel
      const mac = /Mac/.test(win.navigator.platform);
      // xterm.js 5 (ttyd 1.7) sets options on term.options; 4 (ttyd 1.6) only has setOption
      const setOpt = (k, v) => {
        try { if (win.term.options) win.term.options[k] = v; else win.term.setOption(k, v); }
        catch (_) {}
      };
      if (mac) {
        setOpt('macOptionClickForcesSelection', true);
        // a long press lifted without a drag is a short Alt click: xterm.js would type
        // arrow keys into the app to move its cursor there
        setOpt('altClickMovesCursor', false);
      }
      // no native text selection or iOS callout on a long press
      const st = doc.createElement('style');
      st.textContent = '.xterm-screen{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}';
      (doc.head || doc.documentElement).appendChild(st);
      // Shift on a pane that does NOT track the mouse would extend the old selection
      const tracking = () => !!doc.querySelector('.xterm.enable-mouse-events');
      // detail: 1 — xterm.js's mousedown ignores an event without a click count
      const fire = (type, x, y) => screen.dispatchEvent(new win.MouseEvent(type, {
        clientX: x, clientY: y, button: 0, detail: 1, buttons: type === 'mouseup' ? 0 : 1,
        shiftKey: !mac && tracking(), altKey: mac, bubbles: true, cancelable: true, view: win }));
      const cellH = () => {
        const rows = win.term && win.term.rows;
        return rows ? screen.getBoundingClientRect().height / rows : 20;
      };
      let startX = 0, startY = 0, lastX = 0, lastY = 0, accum = 0, timer = 0;
      let mode = null; // null | 'scroll' | 'select' | 'multi'

      screen.addEventListener('touchstart', e => {
        clearTimeout(timer);
        if (e.touches.length !== 1) {                // a second finger ends a selection
          if (mode === 'select') fire('mouseup', lastX, lastY);
          mode = 'multi';
          return;
        }
        const t = e.touches[0];
        startX = lastX = t.clientX;
        startY = lastY = t.clientY;
        mode = null;
        accum = 0;
        try { win.term.clearSelection(); } catch (_) {}
        timer = setTimeout(() => {
          if (mode !== null) return;
          mode = 'select';
          fire('mousedown', startX, startY);
          try { win.navigator.vibrate && win.navigator.vibrate(15); } catch (_) {}
        }, LONG_MS);
      }, {passive: true});

      screen.addEventListener('touchmove', e => {
        if (mode === 'multi' || e.touches.length !== 1) return;
        const t = e.touches[0];
        if (mode === null) {
          if (Math.abs(t.clientX - startX) <= SLOP && Math.abs(t.clientY - startY) <= SLOP) return;
          clearTimeout(timer);
          mode = 'scroll';
        }
        e.preventDefault();
        if (mode === 'select') {
          lastX = t.clientX; lastY = t.clientY;
          fire('mousemove', lastX, lastY);
          return;
        }
        accum += lastY - t.clientY;
        lastY = t.clientY;
        const step = 3 * cellH();
        const lines = Math.trunc(accum / step);
        if (!lines) return;
        accum -= lines * step;
        for (let i = 0; i < Math.abs(lines); i++) {
          screen.dispatchEvent(new win.WheelEvent('wheel', {
            deltaY: lines > 0 ? 120 : -120, deltaMode: 0, bubbles: true, cancelable: true,
            clientX: t.clientX, clientY: t.clientY
          }));
        }
      }, {passive: false});

      const end = (e, copy) => {
        clearTimeout(timer);
        if (mode === 'multi') { if (!e.touches.length) mode = null; return; }
        if (mode === 'select') {
          const t = e.changedTouches[0] || {clientX: lastX, clientY: lastY};
          fire('mouseup', t.clientX, t.clientY);
          if (e.cancelable) e.preventDefault();      // no compat click into the app
          let txt = '';
          try { txt = win.term.getSelection(); } catch (_) {}
          // the clipboard of whichever document has focus accepts the write
          if (copy && txt) _copyText(doc, txt, doc.hasFocus() ? win.navigator : navigator);
        }
        mode = null;
      };
      screen.addEventListener('touchend', e => end(e, true), {passive: false});
      screen.addEventListener('touchcancel', e => end(e, false), {passive: false});
    }

    /* ── Clipboard: after mouse selection in tmux, copy buffer to system clipboard ── */
    // Right-clicking the terminal popped the browser's native context menu — newer ttyd
    // (xterm.js 5.x client) doesn't preventDefault it the way the older client did. Quiet it
    // on the same-origin terminal iframe (capturing listener on its document) so right-click
    // stays out of the way, regardless of the installed ttyd version.
    function suppressContextMenu(iframe) {
      iframe.addEventListener('load', () => {
        try {
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          doc.addEventListener('contextmenu', e => e.preventDefault(), true);
        } catch (e) { /* cross-origin (shouldn't happen) — ignore */ }
      });
    }

    function enableClipboardCopy(iframe) {
      iframe.addEventListener('load', () => {
        let attempts = 0;
        const poll = setInterval(() => {
          if (++attempts > 50) { clearInterval(poll); return; }
          try {
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            if (!doc.querySelector('.xterm')) return;
            clearInterval(poll);
            const bufUrl = location.origin + '/api/tmux-buffer/?session=global';
            const readBuf = async () => {
              try { return (await (await fetch(bufUrl)).json()).text || ''; } catch { return ''; }
            };
            // Snapshot the tmux buffer as the selection STARTS. `tmux show-buffer`
            // lags one selection behind the mouseup (browser→ttyd→tmux round-trip),
            // so on copy we must wait until the buffer differs from this pre-selection
            // anchor — otherwise we'd grab the PREVIOUS selection (the off-by-one bug
            // where you had to copy twice to paste the current text).
            let anchorPromise = Promise.resolve(''), _downX = 0, _downY = 0, _gen = 0;
            doc.addEventListener('mousedown', (e) => { _downX = e.clientX; _downY = e.clientY; anchorPromise = readBuf(); _tmuxSel = null; });
            doc.addEventListener('mouseup', (e) => {
              // only a real drag is a selection — a plain click shouldn't touch the clipboard
              if (Math.abs(e.clientX - _downX) < 4 && Math.abs(e.clientY - _downY) < 4) return;
              const myGen = ++_gen;                          // supersede any older poll loop
              try { window.focus(); } catch (_) {}           // clipboard.write needs a focused doc
              // ClipboardItem with a Promise lets write() run inside the gesture while the
              // text resolves async. CRITICAL: it must resolve FAST — real Chrome aborts the
              // write if the promise hangs ~>1s. So poll the tmux buffer only briefly (~700ms),
              // take the first value that differs from the pre-selection anchor (the NEW
              // selection), and ALWAYS resolve with something so copy never silently fails.
              const textPromise = new Promise((resolve) => {
                (async () => {
                  const anchor = await anchorPromise;        // buffer BEFORE this selection
                  let last = '';
                  for (let i = 0; i < 14; i++) {             // ~700ms max, 50ms steps
                    const t = await readBuf();
                    if (t && t.trim()) {
                      last = t;
                      if (t !== anchor) { resolve(new Blob([t], {type: 'text/plain'})); return; }  // new selection landed
                    }
                    if (myGen !== _gen) break;               // a newer selection took over
                    await new Promise(r => setTimeout(r, 50));
                  }
                  resolve(new Blob([last], {type: 'text/plain'}));   // fallback: copy current buffer (never reject)
                })();
              });
              // Ctrl+C right after this drag copies it again instead of sending ^C
              const sel = { text: null, doc: doc, at: Date.now(),
                            promise: textPromise.then(b => b.text()).catch(() => '') };
              sel.promise.then(t => { sel.text = (t && t.trim()) ? t : ''; });
              _tmuxSel = sel;
              // the "Copied" chip only when non-empty text really reached the clipboard
              const copied = () => textPromise.then(b => b.text())
                .then(t => { if (t && t.trim()) showCopyHint(); }).catch(() => {});
              const fallback = () => textPromise.then(b => b.text())
                .then(t => t && t.trim() && navigator.clipboard.writeText(t).then(() => showCopyHint()))
                .catch(() => {});
              try {
                navigator.clipboard.write([
                  new ClipboardItem({'text/plain': textPromise})
                ]).then(copied, fallback);   // no Promise ClipboardItem support → writeText
              } catch (_) {
                fallback();
              }
            });
          } catch(e) { clearInterval(poll); }
        }, 100);
      });
    }

    /* ── Paste / drop an image into the terminal: a ttyd/tmux terminal is text-only,
       so an image can't be pasted. Upload it, then type the saved file PATH into the
       terminal — Claude Code auto-attaches the image path as [Image]. Visible toasts
       so it's obvious what happened; handlers on BOTH the iframe and the parent doc
       (the paste fires wherever focus is). ── */
    function _toast(msg, ms) {
      let t = document.getElementById('_imgToast');
      if (!t) {
        t = document.createElement('div'); t.id = '_imgToast';
        t.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99999;' +
          'background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:9px 14px;' +
          'font:13px/1.3 Inter,system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .15s;pointer-events:none';
        document.body.appendChild(t);
      }
      t.textContent = msg; t.style.opacity = '1';
      clearTimeout(t._h); t._h = setTimeout(() => { t.style.opacity = '0'; }, ms || 2600);
    }

    // diagnostics disabled now that image paste works (kept as a no-op so the call
    // sites stay harmless; flip the body back on to debug again)
    function _clientlog() {}

    function _imageFromData(dt) {
      const items = (dt && dt.items) || [];
      for (const it of items) { if (it.kind === 'file' && (it.type || '').startsWith('image/')) return it.getAsFile(); }
      const files = (dt && dt.files) || [];
      for (const fl of files) { if ((fl.type || '').startsWith('image/')) return fl; }
      return null;
    }

    // read the clipboard image directly (used by the 📎 button AND the Ctrl+V hotkey)
    async function _pasteImageFromClipboard(src) {
      _clientlog({ ev: 'read-start', src: src || '?', hasAPI: !!(navigator.clipboard && navigator.clipboard.read), focused: document.hasFocus() });
      if (!navigator.clipboard || !navigator.clipboard.read) {
        _toast('⚠️ Browser can\'t read the clipboard — drag an image file onto the terminal', 5000); return;
      }
      try { window.focus(); } catch (_) {}              // clipboard.read() needs a focused doc
      _toast('📎 Reading clipboard…', 8000);
      try {
        const items = await navigator.clipboard.read();
        let blob = null; const allTypes = [];
        for (const it of items) {
          (it.types || []).forEach(t => allTypes.push(t));
          const type = (it.types || []).find(t => t.startsWith('image/'));
          if (type) { blob = await it.getType(type); break; }
        }
        _clientlog({ ev: 'read-done', src: src || '?', types: allTypes, gotImage: !!blob });
        if (!blob) {
          _toast('⚠️ No image in clipboard. Types: ' + (allTypes.join(', ') || 'none'), 6000);
          return;
        }
        await _uploadAndInsertImage(blob);
      } catch (e) {
        _clientlog({ ev: 'read-error', src: src || '?', error: String(e && e.message || e) });
        _toast('⚠️ Clipboard: ' + String(e && e.message || e).slice(0, 70), 6000);
      }
    }

    // Ctrl+V (no Shift) is the standard paste, like any app: we only stop xterm from
    // turning it into a ^V byte and let the BROWSER paste — the native 'paste' event
    // carries the clipboard's text and files (no permission prompt, works on http).
    // Text goes to the terminal through xterm's own paste listener (exactly once);
    // an image is caught by _onImagePaste and uploaded. That is also what makes
    // dictation apps work that put text on the clipboard and press Ctrl+V for you
    // (Wispr Flow). On a Mac, Ctrl+V is not the paste key (⌘V is, and it is left to
    // the browser), so there Ctrl+V keeps reading an image straight off the clipboard.
    // Ctrl+Shift+V stays the terminal's text paste.
    // Ctrl+C (no Shift) in the terminal copies a selection, like Windows Terminal,
    // and only sends the interrupt (^C) when nothing is selected. Not on a Mac (⌘C).
    // tmux cancels its selection on mouseup (copy-selection-and-cancel), so nothing stays
    // highlighted: the drag counts for Ctrl+C only RIGHT after it (a few seconds), in the
    // same terminal — otherwise Claude's interrupt would be silently swallowed later.
    let _tmuxSel = null;          // {text|null, doc, at} — the last mouse selection copied from tmux
    const TMUX_SEL_MS = 3000;
    // Ctrl+<letter> by the key's CODE when the layout isn't Latin (Russian: Ctrl+V is 'м')
    function _ctrlLetter(e) {
      const k = (e.key || '').toLowerCase();
      if (/^[a-z]$/.test(k)) return k;
      const m = /^Key([A-Z])$/.exec(e.code || '');
      if (m) return m[1].toLowerCase();
      // simulated keys (Wispr Flow and other dictation apps press Ctrl+V for you) come
      // without a physical code on a non-Latin layout: only keyCode tells the letter
      const kc = e.keyCode || e.which || 0;
      return (kc >= 65 && kc <= 90) ? String.fromCharCode(kc + 32) : k;
    }
    function _isModifierKey(e) { return /^(Control|Shift|Alt|Meta|AltGraph|CapsLock)$/.test(e.key || ''); }
    // nav: the navigator whose clipboard to write (default: the dashboard's)
    function _copyText(doc, t, nav) {
      const viaExec = () => {
        try {
          const ta = doc.createElement('textarea'); ta.value = t;
          ta.style.cssText = 'position:fixed;opacity:0;left:0;top:0';
          const back = doc.activeElement;
          doc.body.appendChild(ta); ta.select();
          const ok = doc.execCommand('copy'); ta.remove();
          try { back && back.focus && back.focus(); } catch (_) {}
          if (ok) showCopyHint();
        } catch (_) {}
      };
      const clip = (nav || navigator).clipboard;
      if (clip && clip.writeText) clip.writeText(t).then(showCopyHint, viaExec);
      else viaExec();
    }
    function _copySelectionOnCtrlC(e) {
      const doc = (e.target && e.target.ownerDocument) || document;
      const term = doc.defaultView && doc.defaultView.term;
      let text = '';
      try { if (term && term.hasSelection && term.hasSelection()) text = term.getSelection() || ''; } catch (_) {}
      if (text) {
        try { term.clearSelection(); } catch (_) {}
        _tmuxSel = null;
      } else if (_tmuxSel && _tmuxSel.text !== '' && _tmuxSel.doc === doc
                 && Date.now() - _tmuxSel.at < TMUX_SEL_MS) {
        const sel = _tmuxSel; _tmuxSel = null;
        if (sel.text) text = sel.text;
        else {                                         // the buffer read is still running
          e.preventDefault(); e.stopPropagation(); if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          sel.promise.then(t => { if (t && t.trim()) _copyText(doc, t); });
          return true;
        }
      }
      if (!text) return false;
      e.preventDefault(); e.stopPropagation(); if (e.stopImmediatePropagation) e.stopImmediatePropagation();
      _copyText(doc, text);
      return true;
    }
    function _onTermKeydown(e, scope) {
      const key = _ctrlLetter(e);
      const ctrlC = scope !== 'parent' && !_isMac && e.ctrlKey && !e.shiftKey && !e.altKey
                    && !e.metaKey && key === 'c';
      if (ctrlC) { if (!_copySelectionOnCtrlC(e)) _tmuxSel = null; return; }
      if (scope !== 'parent' && !_isModifierKey(e)) _tmuxSel = null;   // typing ends the selection
      if (!e.ctrlKey || e.altKey || e.metaKey) return;
      if (key !== 'v') return;
      _clientlog({ ev: 'ctrlv-seen', scope: scope || 'iframe', shift: e.shiftKey });
      if (e.shiftKey) return;                         // Ctrl+Shift+V = text paste, leave it
      // on the parent, don't touch Ctrl+V in real text fields (project name, etc.)
      if (scope === 'parent') {
        const t = e.target, tag = (t && t.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || (t && t.isContentEditable)) return;
      }
      if (_isMac) {                                   // Mac: Ctrl+V = image hotkey (⌘V pastes)
        e.preventDefault(); e.stopPropagation();
        if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        _pasteImageFromClipboard('ctrlv-' + (scope || 'iframe'));
        return;
      }
      // keep xterm from sending ^V, but NOT preventDefault: the browser's paste follows
      e.stopPropagation();
      if (e.stopImmediatePropagation) e.stopImmediatePropagation();
    }
    // page-level Ctrl+V (focus on the dashboard / a button, not inside the terminal)
    document.addEventListener('keydown', (e) => _onTermKeydown(e, 'parent'), true);

    // type text into the open terminal as a paste; returns how ('none' = not ready)
    function _insertIntoTerminal(f, text) {
      // ttyd's xterm has no .input(); term.paste() is the proper API, _onData.fire fallback
      let term = null;
      try { term = f.contentWindow.term; } catch (_) {}
      let how = 'none';
      if (term && typeof term.paste === 'function') { term.paste(text); how = 'paste'; }
      else if (term && typeof term.input === 'function') { term.input(text); how = 'input'; }
      else if (term && term._core && term._core._onData) { try { term._core._onData.fire(text); how = 'onData'; } catch (_) {} }
      if (how === 'none') return how;
      // restore focus to the terminal's INPUT (not just the iframe window) so Enter
      // sends immediately — the button click / Ctrl+V had moved focus away.
      const refocus = () => {
        try { f.contentWindow.focus(); } catch (_) {}
        try { if (term && typeof term.focus === 'function') term.focus(); } catch (_) {}
        try {
          const ta = (f.contentDocument || f.contentWindow.document).querySelector('.xterm-helper-textarea');
          if (ta) ta.focus();
        } catch (_) {}
      };
      refocus();
      setTimeout(refocus, 60);                        // again after the gesture settles
      return how;
    }

    async function _uploadAndInsertImage(blob) {
      const f = document.querySelector('#wrap iframe');
      _clientlog({ ev: 'upload-start', size: blob && blob.size, type: blob && blob.type, hasTerminal: !!f });
      if (!f) { _toast('⚠️ Select a terminal first'); return; }
      _toast('📎 Uploading image…', 10000);
      try {
        const r = await fetch('/api/paste-image', {
          method: 'POST', headers: { 'Content-Type': blob.type || 'image/png' },
          body: blob, credentials: 'same-origin',
        });
        if (!r.ok) { _clientlog({ ev: 'upload-http-fail', status: r.status }); _toast('⚠️ Upload error (HTTP ' + r.status + ')'); return; }
        const d = await r.json();
        if (!d || !d.path) { _toast('⚠️ Server returned no path'); return; }
        if (_insertIntoTerminal(f, d.path + ' ') === 'none') { _toast('⚠️ Terminal not ready'); return; }
        _toast('✅ Image pasted');
      } catch (e) { _clientlog({ ev: 'upload-error', error: String(e && e.message || e) }); _toast('⚠️ ' + String(e && e.message || e).slice(0, 50)); }
    }

    /* ── 📎 File: any file → a private folder on the server → its PATH into the terminal ──
       A path, not a link: the agent runs on the server and reads the file there. XHR, not
       fetch, for the upload progress. Several files go one after another; the paths are
       typed into the open terminal space-separated and copied to the clipboard. */
    function _uploadFile(file, onProgress) {
      return new Promise((resolve, reject) => {
        const x = new XMLHttpRequest();
        x.open('POST', '/api/upload?name=' + encodeURIComponent(file.name || 'file'));
        x.withCredentials = true;
        x.setRequestHeader('Content-Type', 'application/octet-stream');
        x.upload.onprogress = e => { if (e.lengthComputable && e.total) onProgress(e.loaded / e.total); };
        x.onload = () => {
          let d = null;
          try { d = JSON.parse(x.responseText); } catch (_) {}
          if (x.status === 200 && d && d.path) return resolve(d);
          // 413 from status_server carries its cap; one from a proxy in front (nginx,
          // Cloudflare) is an HTML page with a smaller limit we don't know
          if (x.status === 413) return reject(new Error(d && d.max_mb ? 'too large (max ' + d.max_mb + ' MB)'
                                                                       : 'too large for this server'));
          if (x.status === 401) return reject(new Error('signed out — reload the page'));
          reject(new Error((d && d.error) || ('HTTP ' + x.status)));
        };
        x.onerror = () => reject(new Error('network error'));
        x.send(file);
      });
    }

    async function _copyQuiet(text, f) {
      // the clipboard of whichever document has focus accepts the write
      const navs = [];
      try { if (f && f.contentDocument && f.contentDocument.hasFocus()) navs.push(f.contentWindow.navigator); } catch (_) {}
      navs.push(navigator);
      for (const n of navs) {
        try { await n.clipboard.writeText(text); return true; } catch (_) {}
      }
      return false;
    }

    let _uploading = false;
    async function _uploadFiles(files) {
      files = Array.from(files || []).filter(Boolean);
      if (!files.length) return;
      if (_uploading) { _toast('⏳ Still uploading — wait a moment'); return; }
      _uploading = true;
      const paths = [], failed = [];
      try {
        for (let i = 0; i < files.length; i++) {
          const fl = files[i], of = files.length > 1 ? ' (' + (i + 1) + '/' + files.length + ')' : '';
          _toast('📎 Uploading ' + fl.name + of + '…', 120000);
          try {
            const d = await _uploadFile(fl, p =>
              _toast('📎 Uploading ' + fl.name + of + '… ' + Math.round(p * 100) + '%', 120000));
            paths.push(d.path);
          } catch (e) { failed.push(fl.name + ': ' + (e && e.message || e)); }
        }
      } finally { _uploading = false; }
      if (!paths.length) { _toast('⚠️ ' + failed.join(' · '), 8000); return; }
      const text = paths.join(' ');
      const f = document.querySelector('#wrap iframe');
      const typed = !!f && _insertIntoTerminal(f, text + ' ') !== 'none';
      const copied = await _copyQuiet(text, f);
      const what = paths.length > 1 ? paths.length + ' files' : 'File';
      const where = typed ? (copied ? 'path in the terminal and copied' : 'path in the terminal')
                          : (copied ? 'path copied' : text);
      _toast('✅ ' + what + ' uploaded — ' + where + (failed.length ? ' · ⚠️ ' + failed.join(' · ') : ''),
             failed.length ? 8000 : 4000);
    }

    // files dragged over the dashboard or the terminal: show the drop frame
    let _dropTimer = 0;
    function _isFileDrag(e) { return !!(e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')); }
    function _dropHint(on) {
      const w = document.getElementById('wrap');
      clearTimeout(_dropTimer);
      if (!w) return;
      w.classList.toggle('drop-files', on);
      if (on) _dropTimer = setTimeout(() => w.classList.remove('drop-files'), 400);
    }
    function _onFilesDragOver(e) {
      if (!_isFileDrag(e)) return;
      e.preventDefault();
      _dropHint(true);
    }
    function _onFilesDrop(e) {
      const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
      _dropHint(false);
      if (!files.length) return;
      e.preventDefault(); e.stopPropagation();
      _uploadFiles(files);
    }

    function _onImagePaste(e) {
      const blob = _imageFromData(e.clipboardData);
      _clientlog({ ev: 'paste-event', gotImage: !!blob, types: e.clipboardData ? Array.from(e.clipboardData.types || []) : 'null' });
      if (blob) { e.preventDefault(); e.stopPropagation(); _uploadAndInsertImage(blob); return; }
      const dt = e.clipboardData, text = dt ? dt.getData('text/plain') : '';
      if (text) return;                               // text → xterm's own paste listener, once
      // neither text nor an image file in the event (some image formats aren't exposed
      // as files): read the clipboard directly, as the Ctrl+V hotkey used to
      if (dt && Array.from(dt.types || []).some(t => /^image\//.test(t))) {
        e.preventDefault(); e.stopPropagation();
        _pasteImageFromClipboard('paste-event');
      }
    }

    // a paste on the dashboard itself (focus on a button / the page, not in a text
    // field): an image uploads as before; text goes into the open terminal.
    function _onParentPaste(e) {
      if (_imageFromData(e.clipboardData)) return _onImagePaste(e);
      const t = e.target, tag = (t && t.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || (t && t.isContentEditable)) return;
      const text = e.clipboardData ? e.clipboardData.getData('text/plain') : '';
      const f = document.querySelector('#wrap iframe');
      if (!text || !f || !f.contentWindow || !('term' in f.contentWindow)) return;
      e.preventDefault(); e.stopPropagation();
      _insertIntoTerminal(f, text);
    }

    // catch the paste wherever focus is: parent document … (text fields on the
    // dashboard keep their normal text paste — see _onParentPaste).
    document.addEventListener('paste', _onParentPaste, true);
    window.addEventListener('drop', _onFilesDrop, true);
    window.addEventListener('dragover', _onFilesDragOver, true);

    // … and inside the terminal iframe (focus is usually there). Attach on load AND
    // immediately (the iframe may already be loaded when this runs), and mark the doc
    // so we never double-bind.
    function enablePasteImage(iframe) {
      const attach = () => {
        let attempts = 0;
        const poll = setInterval(() => {
          if (++attempts > 80) { clearInterval(poll); return; }
          try {
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            if (!doc || !doc.querySelector('.xterm')) return;
            clearInterval(poll);
            if (doc.__pasteImgBound) return;
            doc.__pasteImgBound = true;
            _clientlog({ ev: 'iframe-bound' });
            doc.addEventListener('paste', _onImagePaste, true);
            doc.addEventListener('keydown', (e) => _onTermKeydown(e, 'iframe'), true);   // Ctrl+V paste / Ctrl+C copy inside the terminal
            doc.addEventListener('drop', _onFilesDrop, true);
            doc.addEventListener('dragover', _onFilesDragOver, true);
          } catch (e) { clearInterval(poll); }
        }, 100);
      };
      iframe.addEventListener('load', attach);
      attach();   // in case it's already loaded
    }

    function syncTop(s) {
      const el = document.getElementById('tInfo');
      const st = s.archived ? 'archived' : !s.active ? (s.id === SHELL ? 'starting' : 'unloaded')
               : s.status === 'working' ? 'working' : 'idle';
      el.innerHTML = s.name ? '<b>' + esc(s.name) + '</b> &mdash; ' + st : '';
    }

    function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

    function setSystem(s) {
      document.getElementById('cpuVal').textContent = s.cpu_pct + '%';
      const gb = mb => (mb / 1000).toFixed(1);       // 13829/23460 MB -> 13.8/23.5G
      document.getElementById('ramVal').textContent = gb(s.ram_used_mb) + '/' + gb(s.ram_total_mb) + 'G';
      document.getElementById('cpuStat').className = 'stat' + (s.cpu_pct > 90 ? ' crit' : s.cpu_pct > 70 ? ' warn' : '');
      document.getElementById('ramStat').className = 'stat' + (s.ram_pct > 90 ? ' crit' : s.ram_pct > 70 ? ' warn' : '');
    }

    // CPU/RAM: taken from /api/library when it carries `_system`; otherwise from
    // the old status endpoint (read for `_system` only — nothing slot-related).
    let _sysTick = 0;
    async function pollSystem() {
      try {
        const r = await fetch('/api/terminal-status');
        if (!r.ok) return;
        const d = await r.json();
        if (d && d._system) setSystem(d._system);
      } catch {}
    }

    async function poll() {
      const seq = mutSeq;
      try {
        const r = await fetch('/api/library?archived=1',
                              {cache: 'no-store', credentials: 'same-origin'});
        if (!r.ok) return;                       // 401/5xx → skip this tick, don't churn
        const d = await r.json();
        if (d && d._system) setSystem(d._system);
        else if (_sysTick++ % 2 === 0) pollSystem();
        const sh = d && d.shell;
        if (seq === mutSeq) shellState = sh && typeof sh === 'object'
          ? {active: sh.active === true, attached: sh.attached === true,
             status: sh.status === 'working' ? 'working' : 'idle'}
          : null;
        // the open shell ended (`exit` typed in it): drop its frame. Only once it
        // had been seen running — right after cmd it is still starting.
        if (seq === mutSeq && sel === SHELL) {
          if (shellState && shellState.active) _shellSeenUp = true;
          else if (_shellSeenUp) showPlaceholder();
        }
        if (!d || !Array.isArray(d.sessions)) { render(); syncSel(); return; }
        if (seq !== mutSeq) return;              // a local change raced this poll — next one is fresh
        sessions = d.sessions
          .filter(s => s && ID_RE.test(s.id))
          .map(s => Object.assign({}, s, {name: String(s.name ?? '')}));
        render();
        syncSel();
        // the open terminal took a new number: follow it (a tmux re-attach —
        // the terminal's process is not touched). All the way: a background tab
        // (its timers slowed to one a minute) can see two switches in one poll
        // (/clear, work, /clear); stopping at the first would open that earlier
        // row anew. Each step is a switch newer than the one before, so /resume
        // back and forth cannot loop.
        if (ID_RE.test(sel || '')) {
          let cur = sel, seen = _selSwitchSeen;
          for (let i = 0; i < 8; i++) {
            const sw = switchedFrom(cur);
            if (!sw || (cur === sel ? sw.switched_at <= seen : sw.switched_at < seen)) break;
            cur = sw.id; seen = sw.switched_at;
          }
          if (cur !== sel) pick(cur);
        }
        if (_pendingOpen) { const id = _pendingOpen; _pendingOpen = null; openTerminalById(id); }
        if (showTrash) loadTrash();
      } catch {}
    }
    poll(); setInterval(poll, 4000);

    // Live-reload: reload ONLY when the page file's version genuinely changes.
    // Never reload on a non-OK response (e.g. a 401 HTML body) or a non-numeric
    // body — doing that turned a single transient auth hiccup into a reload +
    // login-prompt storm ("dozens of prompts, everything hangs"). Keep polling so
    // it self-heals when auth recovers; only a real, changed mtime triggers a reload.
    let _v = null;
    setInterval(async () => {
      try {
        const r = await fetch('/api/page-version', {cache: 'no-store'});
        if (!r.ok) return;                            // 401/5xx → never reload
        const v = (await r.text()).trim();
        if (!/^[0-9]+(\.[0-9]+)?$/.test(v)) return;   // only a real mtime is a valid version
        if (_v && v !== _v) location.reload();
        _v = v;
      } catch { /* network blip — ignore, never reload on error */ }
    }, 1500);

    // Sliding session: while the panel is open, trade the login cookie for a fresh 30-day
    // one — on load, then every 6 h — so daily use never reaches the expiry. A 401 means
    // already signed out: ignore it, the next request lands on /login as usual.
    const _renewLogin = () => fetch('/login?renew=1', {cache: 'no-store', credentials: 'same-origin'}).catch(() => {});
    _renewLogin(); setInterval(_renewLogin, window.__ad_renew_ms || 6 * 3600 * 1000);
  </script>
</body>
</html>
