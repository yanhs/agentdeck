# AgentDeck's tmux settings. Every tmux server AgentDeck starts is started with
# `tmux -f <repo>/tmux.conf` (library_cli.tmux_argv); a server that was already
# running gets this file once via `source-file` (library_cli.ensure_tmux_conf).
# Your own ~/.tmux.conf is sourced at the end, so it still applies on top.

# Marks a server that has read this file (library_cli sources it only once).
set -g @agentdeck-conf 1

# Mouse: select text by dragging in a dashboard terminal, scroll with the wheel.
set -g mouse on

# Let tmux set the terminal's clipboard (OSC 52) when it copies.
set -s set-clipboard on

# Releasing the mouse copies the selection into tmux's buffer and leaves copy
# mode; the dashboard's copy reads that buffer (/api/tmux-buffer).
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Long scrollback for long Claude sessions.
set -g history-limit 50000

set -g default-terminal "xterm-256color"

# Right click belongs to the browser (its own menu, paste), not tmux's menu.
unbind -T root MouseDown3Pane
unbind -T root MouseDown3Status
unbind -T root MouseDown3StatusLeft
unbind -T root M-MouseDown3Pane

# The user's own config, if any, last.
if-shell "test -f ~/.tmux.conf" "source-file ~/.tmux.conf"
