# A ready image with every release: ghcr.io/yanhs/agentkennel:<version> and :latest, for
# amd64 and arm64 (the Dockerfile picks ttyd for the build CPU). `docker compose up -d`
# downloads it instead of building. Run it by hand for a tag that is already released.
name: image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "the released tag to build, e.g. v2.2.0"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - id: v
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/yanhs/agentkennel:${{ steps.v.outputs.version }}
            ghcr.io/yanhs/agentkennel:latest
          labels: |
            org.opencontainers.image.source=https://github.com/yanhs/agentkennel
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=AgentKennel: Claude Code terminals on your own server, in the browser
