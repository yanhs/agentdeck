# AgentDeck guests — sbx.reimake.com: files guests hand out by link.
# Source of truth: /home/ubuntu/pr/agentdeck-guests/nginx/ (symlinked into sites-enabled).
server {
    listen 80;
    listen [::]:80;
    server_name sbx.reimake.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sbx.reimake.com;
    ssl_certificate /etc/letsencrypt/live/sbx.reimake.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sbx.reimake.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # /f/<guest>-<random key>/<file> -> agentdeck-guests/public/<guest>-<key>/<file>
    # (each guest's /work/public). No listing; a symlink a guest plants can't reach
    # host files; guest HTML/JS runs sandboxed (no access to reimake.com cookies).
    location /f/ {
        alias /home/ubuntu/pr/agentdeck-guests/public/;
        autoindex off;
        disable_symlinks on;
        add_header Content-Security-Policy "sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
    }
    location / { return 404; }
}
